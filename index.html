  /* ================= Rendering ================= */
  const el = {
    app: $('app'), folders: $('folders'), list: $('list'), stats: $('stats'),
    title: $('title'), tools: $('tools'), editor: $('editor'), blank: $('blank'), search: $('search'), menu: $('menu'), dlg: $('dlg')
  };

  function renderToday() {
    const d = new Date();
    const f = (weekday, month) => d.toLocaleDateString(undefined, { weekday, day: 'numeric', month });
    $('today').innerHTML = `<span class="date-long">${esc(f('long', 'long'))}</span><span class="date-short">${esc(f('short', 'short'))}</span>`;
  }

  function renderFolders() {
    const counts = new Map();
    state.notes.forEach((n) => n.folders?.forEach((f) => counts.set(f, (counts.get(f) || 0) + 1)));
    const items = [{ id: ALL, name: state.allName, count: state.notes.length }, ...state.folders.map((f) => ({ id: f.id, name: f.name, count: counts.get(f.id) || 0 }))];
    const fhtml = items.map((f) => {
      const inner = ui.renaming === f.id
        ? `<input id="folderInput" type="text" maxlength="24" value="${esc(f.name)}" aria-label="Folder name">`
        : `<span class="folder-name">${esc(f.name)}</span><span class="folder-count">${f.count}</span>`;
      return `<div class="folder" role="tab" tabindex="0" data-folder="${f.id}" aria-selected="${ui.folder === f.id}">${inner}</div>`;
    }).join('');
    if (el.folders._h !== fhtml) { el.folders.innerHTML = fhtml; el.folders._h = fhtml; }
    if (ui.renaming) { const input = $('folderInput'); if (input && document.activeElement !== input) { input.focus(); input.select(); } }
  }

  /* Overview under the list: follows the folder that is open. "Edited" means the text was written in (not a colour, pin or folder change). */
  function renderStats() {
    const today = dayKey(Date.now()), weekAgo = Date.now() - 7 * 864e5;
    let open = 0, words = 0, newToday = 0, editedToday = 0, editedWeek = 0;
    for (const n of state.notes) {
      if (ui.folder !== ALL && !n.folders?.includes(ui.folder)) continue;
      const i = info(n); open += i.total - i.done; words += i.words;
      if (dayKey(n.created) === today) newToday++;
      if (dayKey(n.updated) === today) editedToday++;
      if (n.updated >= weekAgo) editedWeek++;
    }
    const cell = (v, label) => `<div><b>${v}</b><span>${label}</span></div>`;
    const shtml = cell(newToday, 'New') + cell(editedToday, 'Edited') + cell(editedWeek, '7 days') + cell(open, 'Tasks').replace('<div>', open ? '<div class="warm">' : '<div>') + cell(words.toLocaleString(), 'Words');
    if (el.stats._h !== shtml) { el.stats.innerHTML = shtml; el.stats._h = shtml; }
  }

  /* The list is grouped by day (Pinned, Today, Yesterday, ...) the way most note apps do, by the date each note was last edited, the only order (newest first, pinned on top), like a messaging app. */
  const noteDate = (n) => n.updated;
  function rowTime(n) {
    const ms = noteDate(n), now = Date.now();
    if (dayKey(ms) === dayKey(now)) return fmtTime.format(ms);
    return now - ms < 7 * 864e5 ? fmtDay.format(ms) : shortDate(ms);
  }

  const motionOK = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
  function renderList() {
    const notes = visibleNotes();
    $('searchClear').hidden = !ui.query;
    if (!notes.length) {
      const [title, text, action, label] = ui.query
        ? ['Nothing found', 'Try a different word.', 'clear', 'Clear search']
        : state.notes.length
          ? ['This folder is empty', 'Write a note and it will be saved in here.', 'new', 'New note']
          : ['A clean page', 'Write your first note. It saves on this device, even offline.', 'new', 'Write a note'];
      el.list.innerHTML = `<li class="empty-list"><strong>${title}</strong>${text}<br><button class="btn solid" type="button" data-empty="${action}">${label}</button></li>`;
      return;
    }
    /* Rows are kept between renders. Only a row whose text changed is rebuilt, the rest are just put in the right order,
       so opening a note or typing never rebuilds the whole list. Rows that move glide to their new place. */
    if (!el.list.firstElementChild?.dataset.nid) el.list.textContent = '';
    const have = new Map();
    for (const li of el.list.children) have.set(li.dataset.nid, li);
    /* Rows only glide when the order changes or a row is added, so a redraw that changes nothing never forces the browser to measure every row. */
    let sameOrder = have.size === notes.length;
    if (sameOrder) { let k = 0; for (const n of notes) { if (el.list.children[k++]?.dataset.nid !== n.id) { sameOrder = false; break; } } }
    const smooth = motionOK() && have.size > 0 && have.size <= 300 && !sameOrder;
    const before = smooth ? new Map([...have].map(([id, li]) => [id, li.offsetTop])) : null;
    const tpl = document.createElement('template');
    const next = [], fresh = new Set();
    for (const n of notes) {
      const i = info(n);
      const folder = ui.folder === ALL && n.folders ? n.folders.map(folderLabel).join(', ') : '';
      const badge = i.total ? `<span class="badge${i.done === i.total ? ' done' : ''}" title="${i.done} of ${i.total} tasks done">${i.done}/${i.total}</span>` : '';
      const name = n.title || 'Untitled note';
      const html = `<li class="item" data-nid="${n.id}" style="--nc:var(--${n.color});--on-nc:var(--on-${n.color})"><button class="row" type="button" data-id="${n.id}" aria-current="${n.id === ui.activeId}"><span class="av-gap"></span><span class="row-main">` +
        `<span class="row-top"><span class="row-title">${esc(name)}</span><span class="row-time">${esc(rowTime(n))}</span></span>` +
        `<span class="row-bot"><span class="row-snip">${folder ? `<b>${esc(folder)}</b> ` : ''}${esc(snippet(n))}</span>${badge}${n.pinned ? PIN_ICON : ''}</span></span></button>` +
        `<button class="av-btn" type="button" data-more="${n.id}" aria-label="Options for ${esc(name)}" title="Options">${avatar(n, 48)}</button></li>`;
      let li = have.get(n.id);
      if (!li || li._h !== html) {
        tpl.innerHTML = html;
        const made = tpl.content.firstElementChild; made._h = html;
        if (li) li.replaceWith(made); else if (have.size) fresh.add(n.id);
        li = made;
        if (ui.pulse === n.id && motionOK()) { ui.pulse = null; requestAnimationFrame(() => li.animate(WASH, { duration: MOTION.wash, easing: MOTION.ease })); }
      }
      next.push(li);
    }
    let ref = el.list.firstChild;
    for (const li of next) { if (li === ref) ref = ref.nextSibling; else el.list.insertBefore(li, ref); }
    while (ref) { const gone = ref; ref = ref.nextSibling; gone.remove(); }
    if (smooth) {
      const lh = el.list.clientHeight;
      for (const li of next) {
        if (fresh.has(li.dataset.nid)) { li.animate([{ opacity: 0 }, { opacity: 1 }], { duration: MOTION.base, easing: MOTION.ease }); continue; }
        const was = before.get(li.dataset.nid); if (was === undefined) continue;
        const d = was - li.offsetTop;
        if (d && Math.abs(d) < lh * 1.5) li.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: MOTION.slow, easing: MOTION.ease });
      }
    }
  }

  const CLOUD = '<path d="M5.2 14.5a3.2 3.2 0 0 1-.4-6.4 4.4 4.4 0 0 1 8.4 1 2.7 2.7 0 0 1-.4 5.4z"/>';
  const UP = CLOUD + '<path class="up" d="M9 12.8V8.2M7.2 9.9L9 8.2l1.8 1.7"/>';
  const CHECK = CLOUD + '<path d="M6.8 10.8l1.7 1.7 3-3.2"/>';
  const SAVE_ICON = {
    saved: CHECK, synced: CHECK, saving: UP, syncing: UP,
    failed: CLOUD + '<path d="M7.5 8.5l3 3M10.5 8.5l-3 3"/>',
    offline: CLOUD + '<path d="M3.5 3.5l11 11"/>',
    syncerr: CLOUD + '<path d="M9 7.6v2.4M9 12.2v.1"/>'
  };
  function paintSaved() {
    const saved = $('saved');
    let kind = 'saved';
    if (!store.ok) kind = 'failed';
    else if (store.status === 'saving') kind = 'saving';
    else if (sync.cfg) kind = sync.status === 'syncing' ? 'syncing' : sync.status === 'offline' ? 'offline' : sync.status === 'error' ? 'syncerr' : 'synced';
    const msg = {
      failed: 'Not saved: browser storage is blocked',
      saving: 'Saving…',
      saved: 'Saved in this browser',
      syncing: 'Syncing…',
      synced: 'Saved and synced with Google Drive',
      offline: 'Offline. Saved here, will sync when you are back online',
      syncerr: `Sync problem: ${sync.err || 'could not reach Google Drive'}. Tap to try again`
    }[kind];
    saved.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SAVE_ICON[kind]}</svg>`;
    saved.title = msg; saved.setAttribute('aria-label', msg);
    saved.className = kind === 'failed' || kind === 'syncerr' ? 'warn' : kind === 'saving' || kind === 'syncing' ? 'busy' : kind === 'synced' ? 'ok' : '';
  }
  store.show = paintSaved;
  function renderFooter(n) {
    const i = info(n);
    $('count').textContent = [`${i.words} words`, `${i.text.length.toLocaleString()} characters`, i.total && `${i.done} of ${i.total} tasks done`, `created ${ago(n.created)}`, `edited ${ago(n.updated)}`].filter(Boolean).join(' · ');
    paintSaved();
  }

  function renderEditor() {
    const n = activeNote();
    el.blank.hidden = !!n;
    ['edTop', 'edScroll', 'edFoot'].forEach((id) => { $(id).hidden = !n; });
    if (!n) {
      const empty = !state.notes.length;
      $('blankTitle').textContent = empty ? 'Your notebook is empty' : 'No note open';
      $('blankText').textContent = empty ? 'Tap New note to write your first one.' : 'Pick a note from the list, or start a new one.';
      return;
    }
    el.title.value = n.title;
    quill.setContents(n.content, SILENT);
    quill.history.clear();
    fmt = {};
    renderNoteHeader(n);
    renderFooter(n);
    applyTypewriter(true);
    syncTools();
  }
  function renderNoteHeader(n) {
    $('edAvatar').innerHTML = avatar(n, 32);
    el.editor.style.setProperty('--nc', `var(--${n.color})`);
    el.editor.style.setProperty('--on-nc', `var(--on-${n.color})`);
  }

  /* The list, folder counts and stats can wait for the next frame, so fast typing does not rebuild them on every key. */
  let refreshQueued = false;
  function refreshLists() {
    if (refreshQueued) return;
    refreshQueued = true;
    requestAnimationFrame(() => { refreshQueued = false; renderFolders(); renderStats(); renderList(); });
  }
  const refreshAll = () => { renderFolders(); renderStats(); renderList(); };
  /* On a phone the editor slides over the list. Whatever is out of sight cannot be tabbed to or read out. */
  const phoneMQ = matchMedia('(max-width: 900px)');
  function applyView(v) {
    el.app.dataset.view = v;
    const phone = phoneMQ.matches;
    for (const sel of ['.topbar', '.listpane', '.fab']) { const x = document.querySelector(sel); if (x) x.inert = phone && v === 'editor'; }
    el.editor.inert = phone && v === 'list';
  }
  /* Back button (phone, tablet and PC alike): every layer on top of the list (an open note, the note menu, settings) adds one browser-history step, so the phone's own
     Back button or swipe closes just the top layer instead of leaving the app. `layers` mirrors the steps we added. */
  const layers = [];
  let pendingBack = 0, waiting = [], backTimer = 0;
  const flush = () => { pendingBack = 0; clearTimeout(backTimer); const w = waiting; waiting = []; w.forEach((f) => f()); };
  const whenIdle = (f) => (pendingBack ? waiting.push(f) : f());
  function pushLayer(kind) {
    whenIdle(() => { if (layers.includes(kind)) return; layers.push(kind); try { history.pushState({ n: layers.length }, ''); } catch { /* the on-screen buttons still work */ } });
  }
  function dropLayer(kind) {
    const i = layers.lastIndexOf(kind); if (i < 0) return;
    const n = layers.length - i; layers.length = i;
    try { pendingBack++; history.go(-n); clearTimeout(backTimer); backTimer = setTimeout(flush, 400); } catch { pendingBack = 0; }
  }
  /* Installed app on a touch phone only: the first Back on the list asks the app to close. If the phone refuses, Back goes through as before. */
  const phoneApp = () => phoneMQ.matches && matchMedia('(pointer: coarse)').matches && (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true);
  function closeLayerUi(kind) {
    if (kind === 'home') { try { window.close(); } catch { /* refused */ } setTimeout(() => { try { history.back(); } catch { /* nothing */ } }, 300); }
    else if (kind === 'ed') { applyView('list'); if (!phoneMQ.matches && ui.activeId) { ui.activeId = null; renderEditor(); renderList(); } }   // on a wide screen, Back also closes the open note
    else if (kind === 'dlg') hideDlg();
    else if (kind === 'menu') hideMenu();
  }
  function setView(v) {
    applyView(v);
    if (v === 'editor') pushLayer('ed'); else dropLayer('ed');
  }
  window.addEventListener('popstate', () => {
    if (pendingBack) pendingBack--;
    const depth = history.state?.n || 0;
    while (layers.length > depth) closeLayerUi(layers.pop());
    if (!pendingBack) flush();
  });
  if (history.state?.n) { try { pendingBack++; history.go(-history.state.n); backTimer = setTimeout(flush, 400); } catch { pendingBack = 0; } }   // a reload inside a note: step back to the list's own entry
  if (phoneApp()) pushLayer('home');
  phoneMQ.addEventListener('change', () => applyView(el.app.dataset.view));
  applyView(el.app.dataset.view);

  /* ================= Notes ================= */
  /* Call after any edit to a note's content or look. */
  function touch(n) {
    n.updated = Date.now();
    if (n.id === ui.activeId) { renderNoteHeader(n); renderFooter(n); }
    store.saveSoon();
    refreshLists();
  }
  /* Call after a change to a note's title, colour, pin or folders. It does not count as writing, so the note keeps its place in the list. */
  function touchMeta(n) {
    n.meta = Date.now(); ui.pulse = n.id;
    if (n.id === ui.activeId) renderNoteHeader(n);
    store.saveSoon();
    refreshLists();
  }
  /* Call after a change that must be saved at once (create, delete, move). */
  function commit() { store.save(); refreshAll(); }

  /* Opening a note only moves the highlight from one row to another, so it does not redraw the whole list (that used to cost 80 to 220 ms before the slide started). */
  function markRow(id, on) {
    const b = id && el.list.querySelector(`[data-nid="${CSS.escape(id)}"] .row`); if (!b) return false;
    b.setAttribute('aria-current', String(on));
    const li = b.parentElement; if (li._h) li._h = li._h.replace(/aria-current="(true|false)"/, `aria-current="${on}"`);
    return true;
  }
  function openNote(id) {
    const prev = ui.activeId;
    ui.activeId = id;
    renderEditor();
    const found = markRow(id, true); if (prev && prev !== id) markRow(prev, false);
    if (!found) renderList();
    setView('editor');
    applyTypewriter(true);
    if (motionOK()) $('edScroll').animate([{ opacity: 0 }, { opacity: 1 }], { duration: MOTION.base, easing: MOTION.ease });
  }
  /* A random accent for each new note, never the same as the newest note's, so neighbours in the list look different. */
  function randomColor() {
    const choices = COLORS.filter((c) => c !== state.notes[0]?.color);
    return choices[Math.floor(Math.random() * choices.length)];
  }
  function newNote() {
    const now = Date.now();
    const n = { id: uid(), title: '', content: [{ insert: '\n' }], color: randomColor(), pinned: false, created: now, updated: now };
    if (ui.folder !== ALL) n.folders = [ui.folder];
    state.notes.unshift(n);
    ui.query = ''; el.search.value = '';
    commit(); openNote(n.id);
    el.title.focus();
  }
  function deleteNote(id) {
    state.gone[id] = Date.now();
    state.notes = state.notes.filter((n) => n.id !== id);
    commit(); toast('Note deleted');
    if (id === ui.activeId) { ui.activeId = null; renderEditor(); renderList(); setView('list'); }
  }
  /* A note opens only when you tap it or create it, and it stays open when you switch folders or search. Deleting it closes the editor. */

  /* ================= Folders ================= */
  function selectFolder(id) {
    ui.folder = id; renderFolders(); renderStats(); renderList();
    if (motionOK()) el.list.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: MOTION.base, easing: MOTION.ease });
  }
  function startRename(id) { ui.renaming = id; renderFolders(); }
  function newFolder() {
    const f = { id: uid(), name: 'New folder', updated: Date.now() };
    state.folders.push(f); store.save(); toast('Folder created');
    ui.folder = f.id; ui.renaming = f.id;
    refreshAll();
    $('folders').querySelector(`[data-folder="${f.id}"]`)?.scrollIntoView?.({ inline: 'nearest', block: 'nearest' });
  }
  function finishRename(save) {
    const id = ui.renaming; if (!id) return;
    const name = $('folderInput')?.value.trim() ?? '';
    ui.renaming = null;
    if (save && name) { if (id === ALL) state.allName = name; else { const f = findFolder(id); if (f) { f.name = name; f.updated = Date.now(); } } store.save(); toast('Renamed'); }
    renderFolders(); renderList();
  }
  function deleteFolder(id) {
    state.notes.forEach((n) => { if (n.folders?.includes(id)) { n.folders = n.folders.filter((f) => f !== id); if (!n.folders.length) delete n.folders; } });
    state.gone[id] = Date.now();
    state.folders = state.folders.filter((f) => f.id !== id);
    store.save();
    if (ui.folder === id) selectFolder(ALL);
    refreshAll(); toast('Folder deleted');
  }

  /* ================= Keyboard shortcuts ================= */
  const shortcutFor = (id) => settings.shortcuts[id] || COMMANDS[id].def;
  const sameKeys = (a, b) => a.code === b.code && !!a.alt === !!b.alt && !!a.shift === !!b.shift;
  const KEY_NAMES = { Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Backslash: '\\', Minus: '-', Equal: '=', Backquote: '`' };
  function keyName(code) {
    if (/^Key[A-Z]$/.test(code)) return code.slice(3);
    if (/^Digit\d$/.test(code)) return code.slice(5);
    return KEY_NAMES[code] || code.replace(/^Numpad/, 'Num ');
  }
  const shortcutText = (c) => [IS_MAC ? '⌘' : 'Ctrl', c.alt && (IS_MAC ? '⌥' : 'Alt'), c.shift && 'Shift', keyName(c.code)].filter(Boolean).join(' + ');

  function renderShortcutHints() {
    $('scSwitch').setAttribute('aria-checked', String(settings.shortcutsOn));
    SHORTCUT_IDS.forEach((id) => {
      const b = el.tools.querySelector(`[data-cmd="${id}"]`);
      if (b) b.title = COMMANDS[id].label + (settings.shortcutsOn ? ` (${shortcutText(shortcutFor(id))})` : '');
    });
  }

  /* ================= Settings dialog ================= */
  let recording = null;                              // id of the command whose shortcut is being recorded
  const say = (t) => { $('kmsg').textContent = t || ''; };
  const keyText = (id) => shortcutText(shortcutFor(id)).replace(/ \+ /g, '+');
  function paintKeys() { $('krows').querySelectorAll('[data-rec]').forEach((i) => { i.value = recording === i.dataset.rec ? 'Press keys…' : keyText(i.dataset.rec); }); }
  function renderDialog() {
    $('krows').innerHTML = SHORTCUT_IDS.map((id) => `<label class="krow"><span>${esc(COMMANDS[id].label)}</span><input class="kbtn" type="text" readonly data-rec="${id}" autocomplete="off" aria-label="Shortcut for ${esc(COMMANDS[id].label)}"></label>`).join('');
    paintKeys();
  }
  function openDialog() { recording = null; say(''); renderDialog(); renderSync(); clearTimeout(dlgTimer); el.dlg.classList.remove('closing'); el.dlg.hidden = false; pushLayer('dlg'); $('kDone').focus(); }
  /* Settings and the note menu fade out for a moment instead of vanishing. */
  let dlgTimer = 0, menuTimer = 0;
  function hideDlg() {
    recording = null;
    if (el.dlg.hidden || el.dlg.classList.contains('closing')) return;
    if (!motionOK()) { el.dlg.hidden = true; return; }
    el.dlg.classList.add('closing');
    clearTimeout(dlgTimer); dlgTimer = setTimeout(() => { el.dlg.hidden = true; el.dlg.classList.remove('closing'); }, 120);
  }
  function closeDialog() { hideDlg(); dropLayer('dlg'); $('settingsBtn').focus(); }
  
  function recordKey(e) {
    if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey) return;               // Tab still moves on
    e.preventDefault(); e.stopPropagation();
    if (e.key === 'Escape') { recording = null; say(''); paintKeys(); document.activeElement.blur(); return; }
    if (/^(Control|Shift|Alt|Meta)(Left|Right)$/.test(e.code)) return;
    if (!(e.ctrlKey || e.metaKey)) { say(`Include ${IS_MAC ? '⌘' : 'Ctrl'} in the shortcut.`); return; }
    const keys = { code: e.code, ...(e.altKey && { alt: true }), ...(e.shiftKey && { shift: true }) };
    const clash = SHORTCUT_IDS.find((id) => id !== recording && sameKeys(shortcutFor(id), keys));
    if (clash) { say(`${shortcutText(keys)} is already used by ${COMMANDS[clash].label}.`); return; }
    settings.shortcuts[recording] = keys; store.save();
    recording = null; say(''); paintKeys(); renderShortcutHints(); document.activeElement.blur();
  }

  /* ================= Options menu: tap a note's avatar (folders: right-click or long-press) ================= */
  const menu = { kind: null, id: null, confirm: false };
  const button = (cls, act, label, extra = '') => `<button class="${cls}" type="button" data-act="${act}"${extra}>${label}</button>`;
  function renderMenu() {
    const m = el.menu;
    if (menu.kind === 'folder') {
      const name = folderLabel(menu.id);
      if (name === undefined) return closeMenu();
      if (menu.confirm) {
        const count = state.notes.filter((n) => n.folders?.includes(menu.id)).length;
        m.innerHTML = `<div class="mh">Delete this folder?</div><div class="mnote">${count ? `${count} ${count === 1 ? 'note stays' : 'notes stay'} in ${esc(state.allName)}.` : 'It has no notes.'}</div>` +
          `<div class="mrow">${button('btn', 'keep', 'Keep it')}${button('btn danger solid', 'delete-folder', 'Delete folder')}</div>`;
        return;
      }
      m.innerHTML = `<div class="mh">${esc(name)}</div>${button('mi', 'rename', 'Rename', ' role="menuitem"')}` +
        (menu.id === ALL ? '' : button('mi danger', 'ask', 'Delete folder', ' role="menuitem"'));
      return;
    }
    const n = findNote(menu.id);
    if (!n) return closeMenu();
    if (menu.confirm) {
      m.innerHTML = `<div class="mh">Delete this note?</div><div class="mrow">${button('btn', 'keep', 'Keep it')}${button('btn danger solid', 'delete-note', 'Delete note')}</div>`;
      return;
    }
    const swatches = COLORS.map((c) => `<button type="button" class="sw" style="background:var(--${c})" role="radio" data-act="color" data-v="${c}" aria-label="${cap(c)}" title="${cap(c)}" aria-checked="${n.color === c}"></button>`).join('');
    const folders = state.folders.length
      ? `<div class="mfolders">${state.folders.map((f) => `<button type="button" class="mchip" data-act="folder" data-v="${f.id}" aria-pressed="${!!n.folders?.includes(f.id)}">${esc(f.name)}</button>`).join('')}</div>`
      : '<div class="mnote">Add a folder with + to organise notes.</div>';
    const pinLabel = n.pinned ? 'Unpin' : 'Pin to top';
    m.style.setProperty('--nc', `var(--${n.color})`); m.style.setProperty('--on-nc', `var(--on-${n.color})`);
    m.innerHTML = `<div class="mhead"><span class="mav" style="--nc:var(--${n.color})">${avatar(n, 36)}</span><div class="mtitle"><b>${esc(n.title || 'Untitled note')}</b><span id="mcolor">${cap(n.color)}</span></div>` +
      `<button class="mpin" type="button" data-act="pin" aria-pressed="${!!n.pinned}" aria-label="${pinLabel}" title="${pinLabel}">${PIN_SVG}</button><button class="mdel" type="button" data-act="ask" aria-label="Delete note" title="Delete note">${TRASH_SVG}</button></div>` +
      `<div class="ml">Colour</div><div class="mcolors" role="radiogroup" aria-label="Note colour">${swatches}</div>` +
      `<div class="ml">Folders</div>${folders}`;
  }

  function setNoteColor(n, c) {
    if (n.color === c) return;
    n.color = c; touchMeta(n);
    el.menu.style.setProperty('--nc', `var(--${c})`); el.menu.style.setProperty('--on-nc', `var(--on-${c})`);
    const head = el.menu.querySelector('.mav'); if (head) { head.style.setProperty('--nc', `var(--${c})`); head.innerHTML = avatar(n, 36); }
    const label = document.getElementById('mcolor'); if (label) label.textContent = cap(c);
    el.menu.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.v === c)));
  }
  function openMenu(kind, id, x, y) {
    if (kind === 'note' ? !findNote(id) : folderLabel(id) === undefined) return;
    Object.assign(menu, { kind, id, confirm: false });
    renderMenu();
    const m = el.menu; clearTimeout(menuTimer); m.classList.remove('closing'); m.hidden = false; pushLayer('menu');
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    m.style.left = `${Math.max(8, Math.min(x, vw - m.offsetWidth - 8))}px`;
    m.style.top = `${Math.max(8, Math.min(y, vh - m.offsetHeight - 8))}px`;
    m.querySelector('button')?.focus({ preventScroll: true });
  }
  function hideMenu() {
    Object.assign(menu, { kind: null, id: null, confirm: false });
    if (el.menu.hidden || el.menu.classList.contains('closing')) return;
    if (!motionOK()) { el.menu.hidden = true; return; }
    el.menu.classList.add('closing');
    clearTimeout(menuTimer); menuTimer = setTimeout(() => { el.menu.hidden = true; el.menu.classList.remove('closing'); }, 120);
  }
  function closeMenu() { hideMenu(); dropLayer('menu'); }

  const menuActions = {
    rename:          () => { const id = menu.id; closeMenu(); startRename(id); },
    ask:             () => { menu.confirm = true; renderMenu(); },
    keep:            () => { menu.confirm = false; renderMenu(); },
    'delete-folder': () => { const id = menu.id; closeMenu(); deleteFolder(id); },
    'delete-note':   () => { const id = menu.id; closeMenu(); deleteNote(id); },
    pin:             (n) => { n.pinned = !n.pinned; touchMeta(n); closeMenu(); toast(n.pinned ? 'Pinned to top' : 'Unpinned'); },
    color:           (n, v) => setNoteColor(n, v),
    folder:          (n, v, b) => {                                              // a note can be in any number of folders
      const set = new Set(n.folders || []); set.has(v) ? set.delete(v) : set.add(v);
      if (set.size) n.folders = state.folders.map((f) => f.id).filter((id) => set.has(id)); else delete n.folders;
      touchMeta(n); b.setAttribute('aria-pressed', String(set.has(v))); toast(set.has(v) ? `Added to ${folderLabel(v)}` : `Removed from ${folderLabel(v)}`);
    }
  };

  /* Folders: long-press on touch screens opens the same menu as right-click. */
  const press = { timer: 0, x: 0, y: 0, fired: false };
  function bindMenu(target, kind, idOf) {
    target.addEventListener('contextmenu', (e) => {
      const id = idOf(e); if (!id) return;
      e.preventDefault();
      let { clientX: x, clientY: y } = e;
      if (!x && !y) { const r = (e.target.closest('button, [data-folder]') || target).getBoundingClientRect(); x = r.left + 24; y = r.bottom; }
      openMenu(kind, id, x, y);
    });
    target.addEventListener('pointerdown', (e) => {
      press.fired = false; clearTimeout(press.timer);
      if (e.pointerType === 'mouse') return;
      const id = idOf(e); if (!id) return;
      press.x = e.clientX; press.y = e.clientY;
      press.timer = setTimeout(() => { press.fired = true; openMenu(kind, id, press.x, press.y); }, 480);
    });
    target.addEventListener('pointermove', (e) => { if (Math.abs(e.clientX - press.x) > 10 || Math.abs(e.clientY - press.y) > 10) clearTimeout(press.timer); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => target.addEventListener(ev, () => clearTimeout(press.timer)));
  }
  /* A long-press that opened a menu must not also count as a tap. */
  const swallowPressTap = () => { if (press.fired) { press.fired = false; return true; } return false; };

  /* ================= Wiring ================= */
  $('newNote').addEventListener('click', newNote);
  $('back').addEventListener('click', () => setView('list'));
  el.search.addEventListener('input', (e) => { ui.query = e.target.value; renderList(); });

  function clearSearch() { ui.query = ''; el.search.value = ''; renderList(); }
  $('searchClear').addEventListener('click', () => { clearSearch(); el.search.focus(); });
  el.list.addEventListener('click', (e) => {
    const more = e.target.closest('[data-more]');
    if (more) { const r = more.getBoundingClientRect(); openMenu('note', more.dataset.more, r.left, r.bottom + 4); return; }
    const empty = e.target.closest('[data-empty]');
    if (empty) { if (empty.dataset.empty === 'new') newNote(); else clearSearch(); return; }
    if (swallowPressTap()) return;
    const row = e.target.closest('[data-id]'); if (row) openNote(row.dataset.id);
  });
  el.list.addEventListener('scroll', closeMenu);

  el.title.addEventListener('input', (e) => { const n = activeNote(); if (n) { n.title = e.target.value; touchMeta(n); } });
  el.title.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); quill.setSelection(quill.getLength() - 1, 0, USER); } });

  /* Shortcuts run before the editor's own keys, so the ones you set are the only ones. */
  root.addEventListener('keydown', (e) => {
    if (e.isComposing || !settings.shortcutsOn || !(e.ctrlKey || e.metaKey)) return;
    const keys = { code: e.code, alt: e.altKey, shift: e.shiftKey };
    const id = SHORTCUT_IDS.find((i) => sameKeys(shortcutFor(i), keys));
    if (id) { e.preventDefault(); e.stopImmediatePropagation(); COMMANDS[id].run(); }
  }, true);

  el.tools.addEventListener('mousedown', (e) => e.preventDefault());             // keep the cursor in the text
  el.tools.addEventListener('click', (e) => { const b = e.target.closest('[data-cmd]'); if (b) COMMANDS[b.dataset.cmd].run(); });

  $('folderAdd').addEventListener('click', newFolder);
  /* Up and Down move through the note list, so it works with arrow keys or a controller. */
  el.list.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const rows = [...el.list.querySelectorAll('.row')], i = rows.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault(); rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus();
  });
  el.folders.addEventListener('click', (e) => {
    if (e.target.closest('input') || swallowPressTap()) return;
    const f = e.target.closest('[data-folder]'); if (f) selectFolder(f.dataset.folder);
  });
  el.folders.addEventListener('dblclick', (e) => { const f = e.target.closest('[data-folder]'); if (f && !e.target.closest('input')) startRename(f.dataset.folder); });
  el.folders.addEventListener('keydown', (e) => {
    if (e.target.id === 'folderInput') {
      if (e.key === 'Enter') { e.preventDefault(); finishRename(true); }
      else if (e.key === 'Escape') finishRename(false);
      return;
    }
    const f = e.target.closest('[data-folder]'); if (!f) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectFolder(f.dataset.folder); }
    else if (e.key === 'F2') { e.preventDefault(); startRename(f.dataset.folder); }
  });
  el.folders.addEventListener('focusout', (e) => { if (e.target.id === 'folderInput') finishRename(true); });

  $('edAvatar').addEventListener('click', (e) => { if (!ui.activeId) return; const r = e.currentTarget.getBoundingClientRect(); openMenu('note', ui.activeId, r.left, r.bottom + 6); });
  bindMenu(el.folders, 'folder', (e) => (e.target.closest('input') ? null : e.target.closest('[data-folder]')?.dataset.folder));
  el.menu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const n = findNote(menu.id), run = menuActions[b.dataset.act];
    if (run && (n || menu.kind === 'folder')) run(n, b.dataset.v, b);
  });
  document.addEventListener('pointerdown', (e) => { if (!el.menu.hidden && !e.target.closest('#menu')) closeMenu(); }, true);
  window.addEventListener('resize', closeMenu);

  $('settingsBtn').addEventListener('click', openDialog);
  $('kDone').addEventListener('click', closeDialog);
  el.dlg.addEventListener('click', (e) => { if (e.target === el.dlg) closeDialog(); });
  $('scSwitch').addEventListener('click', () => { settings.shortcutsOn = !settings.shortcutsOn; store.save(); renderShortcutHints(); });
  $('kReset').addEventListener('click', () => { settings.shortcuts = {}; recording = null; say(''); store.save(); renderDialog(); renderShortcutHints(); });
  /* A shortcut box is a text box: click into it, press the keys you want, done. */
  $('krows').addEventListener('focusin', (e) => { const i = e.target.closest('[data-rec]'); if (!i) return; recording = i.dataset.rec; say(''); paintKeys(); });
  $('krows').addEventListener('focusout', (e) => { if (e.target.closest('[data-rec]') && recording === e.target.dataset.rec) { recording = null; paintKeys(); } });
  document.addEventListener('keydown', (e) => {                                  // Escape closes the dialog or the menu; recording takes every key
    if (!el.dlg.hidden) { if (recording) recordKey(e); else if (e.key === 'Escape') closeDialog(); return; }
    if (e.key === 'Escape' && !el.menu.hidden) closeMenu();
  }, true);

  /* Save what is pending when the page is hidden, and refresh the date after the page was in the background. */
  window.addEventListener('pagehide', () => store.flush());
  document.addEventListener('visibilitychange', () => { if (document.hidden) store.flush(); else { renderToday(); renderStats(); runSync(); } });

  /* ================= Cloud sync ================= */
  const saveSyncCfg = () => { try { if (sync.cfg) localStorage.setItem(SYNC_KEY, JSON.stringify(sync.cfg)); else localStorage.removeItem(SYNC_KEY); } catch { /* ignore */ } };
  const byId = (a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  const localData = () => ({ notes: state.notes, folders: state.folders, gone: state.gone });
  /* A comparable form that ignores key order, so equal data always matches. */
  const sig = (d) => JSON.stringify([
    [...d.notes].sort(byId).map((n) => [n.id, n.title, n.content, n.color, n.pinned, n.created, n.updated, n.meta, n.folders || []]),
    [...d.folders].sort(byId).map((f) => [f.id, f.name, f.updated || 0]),
    Object.entries(d.gone).sort()
  ]);
  function cleanRemote(d) {
    const out = { notes: [], folders: [], gone: {} };
    if (!isObj(d)) return out;
    if (Array.isArray(d.folders)) out.folders = d.folders.filter((f) => isObj(f) && typeof f.id === 'string' && str(f.name).trim()).map((f) => ({ id: f.id, name: f.name, updated: isNum(f.updated) ? f.updated : 0 }));
    const ids = new Set([...out.folders.map((f) => f.id), ...state.folders.map((f) => f.id)]);
    if (Array.isArray(d.notes)) out.notes = d.notes.map((n) => cleanNote(n, ids)).filter(Boolean);
    if (isObj(d.gone)) for (const [k, v] of Object.entries(d.gone)) if (isNum(v)) out.gone[k] = v;
    return out;
  }
  /* Newest edit wins for each note and folder. A deletion wins unless the item was edited after it. */
  function mergeData(a, b) {
    const gone = { ...a.gone };
    for (const [k, v] of Object.entries(b.gone)) gone[k] = Math.max(gone[k] || 0, v);
    const pick = (list) => { const m = new Map(); for (const x of list) { const o = m.get(x.id); if (!o || (x.updated || 0) > (o.updated || 0)) m.set(x.id, x); } return m; };
    /* A note's text comes from whichever copy was written last; its title, colour, pin and folders come from whichever copy had those changed last. */
    const pickNotes = (list) => {
      const text = pick(list), look = new Map();
      for (const x of list) { const o = look.get(x.id); if (!o || (x.meta || 0) > (o.meta || 0)) look.set(x.id, x); }
      for (const [id, t] of text) {
        const l = look.get(id); if (l === t) continue;
        const c = { ...t, title: l.title, color: l.color, pinned: l.pinned, meta: l.meta }; if (l.folders) c.folders = l.folders; else delete c.folders;
        text.set(id, c);
      }
      return text;
    };
    const keep = (m) => { for (const [id, x] of [...m]) { if (gone[id] !== undefined && gone[id] >= Math.max(x.updated || 0, x.meta || 0)) m.delete(id); else delete gone[id]; } return [...m.values()]; };
    const folders = keep(pick([...a.folders, ...b.folders]));
    const ids = new Set(folders.map((f) => f.id));
    const notes = keep(pickNotes([...a.notes, ...b.notes])).map((n) => {
      if (!n.folders?.some((f) => !ids.has(f))) return n;
      const c = { ...n, folders: n.folders.filter((f) => ids.has(f)) };
      if (!c.folders.length) delete c.folders;
      return c;
    }).sort((x, y) => y.created - x.created);
    const cutoff = Date.now() - 90 * 864e5;
    for (const [k, v] of Object.entries(gone)) if (v < cutoff) delete gone[k];
    return { notes, folders, gone };
  }
  const noteFace = (n) => n && JSON.stringify([n.title, n.content]);
  function applyMerged(m) {
    state.notes = m.notes; state.folders = m.folders; state.gone = m.gone;
    store.save(true);
    if (ui.folder !== ALL && !findFolder(ui.folder)) ui.folder = ALL;
    refreshAll();
  }
  async function callSync(body) {
    const r = await fetch(sync.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: sync.cfg.key, ...body }) });
    let j; try { j = await r.json(); } catch { throw new Error('the web app did not answer. Check the URL'); }
    return j;
  }
  function setSync(status, err = '') { const was = sync.status; sync.status = status; sync.err = err; paintSaved(); renderSync(); if (status === 'error' && was !== 'error' && !sync.connecting) toast('Could not sync. Your notes are safe on this device.'); }
  async function runSync() {
    if (!sync.cfg) return;
    if (sync.busy) { sync.again = true; return; }
    if (!navigator.onLine) { setSync('offline'); return; }
    sync.busy = true; setSync('syncing');
    let retry = 0;
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const g = await callSync({ op: 'get' });
        if (!g.ok) throw new Error(g.error === 'auth' ? 'the secret key is wrong' : (g.error || 'the web app refused'));
        const remote = cleanRemote(g.data);
        const before = localData();
        const merged = mergeData(before, remote);
        const open = activeNote();
        const incoming = open && merged.notes.find((n) => n.id === open.id);
        const openChanges = open && (!incoming || noteFace(incoming) !== noteFace(open));
        if (openChanges && (document.activeElement === el.title || quill.hasFocus())) { retry = 4000; break; }   // never replace the note while you are typing in it
        const wasOpen = ui.activeId;
        if (sig(merged) !== sig(before)) {
          applyMerged(merged);
          if (wasOpen && !findNote(wasOpen)) { ui.activeId = null; renderEditor(); renderList(); setView('list'); }
          else if (openChanges) renderEditor();
        }
        if (sig(merged) === sig(remote)) { sync.cfg.last = Date.now(); saveSyncCfg(); setSync('synced'); return; }
        const p = await callSync({ op: 'put', rev: g.rev, data: { v: 1, notes: merged.notes, folders: merged.folders, gone: merged.gone } });
        if (p.ok) { sync.cfg.last = Date.now(); saveSyncCfg(); setSync('synced'); return; }
        if (p.error !== 'conflict') throw new Error(p.error === 'auth' ? 'the secret key is wrong' : (p.error || 'the web app refused'));
      }
      if (!retry) throw new Error('another device kept changing the notes');
    } catch (e) {
      if (!navigator.onLine || e instanceof TypeError) setSync('offline'); else setSync('error', e.message);
      return;
    } finally {
      sync.busy = false;
      if (sync.again) { sync.again = false; retry = retry || 1500; }
      if (retry) scheduleSync(retry);
    }
  }
  function scheduleSync(ms = 2500) { if (!sync.cfg) return; clearTimeout(sync.timer); sync.timer = setTimeout(runSync, ms); }
  store.after = () => scheduleSync();

  /* Sync section of the settings dialog */
  function renderSync() {
    const on = !!sync.cfg;
    $('syncForm').hidden = on; $('syncOn').hidden = !on;
    const st = $('syncState');
    st.className = 'sync-state' + (on && sync.status === 'synced' ? ' ok' : on && sync.status === 'error' ? ' bad' : '');
    st.textContent = !on ? 'Off' : { syncing: 'Syncing…', synced: 'Synced', offline: 'Offline', error: 'Problem', idle: 'Connected' }[sync.status];
    $('syncInfo').textContent = !on ? '' : sync.status === 'error' ? `Problem: ${sync.err}.` : sync.cfg.last ? `Connected. Last synced ${ago(sync.cfg.last)}.` : 'Connected.';
  }
  async function connectSync() {
    const url = $('syncUrl').value.trim(), key = $('syncSecret').value.trim();
    const bad = (t) => { const st = $('syncState'); st.textContent = t; st.className = 'sync-state bad'; };
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) return bad('Check the URL');
    if (!key) return bad('Enter the key');
    sync.cfg = { url, key, last: 0 }; saveSyncCfg();
    sync.connecting = true;
    try { await runSync(); } finally { sync.connecting = false; }
    if (sync.status === 'error' || sync.status === 'offline') { const msg = sync.status === 'offline' ? 'you are offline' : sync.err; sync.cfg = null; saveSyncCfg(); setSync('idle'); bad(`Failed: ${msg}`); }
    else { $('syncSecret').value = ''; toast('Sync connected'); }
  }
  function disconnectSync() { clearTimeout(sync.timer); sync.cfg = null; saveSyncCfg(); sync.status = 'idle'; paintSaved(); renderSync(); toast('Sync disconnected'); }
  $('syncConnect').addEventListener('click', connectSync);
  $('syncNow').addEventListener('click', async () => { await runSync(); if (sync.status === 'synced') toast('Synced'); else if (sync.status === 'offline') toast('You are offline'); });
  $('syncOff').addEventListener('click', disconnectSync);
  $('saved').addEventListener('click', () => { if (sync.cfg) runSync(); });
  window.addEventListener('online', () => runSync());
  window.addEventListener('offline', () => { if (sync.cfg) setSync('offline'); });
  setInterval(() => { if (sync.cfg && !document.hidden) runSync(); }, 60000);

  /* ================= Start ================= */
  renderToday();
  renderShortcutHints();
  applyTypewriter();
  refreshAll();
  renderEditor();
  renderSync();
  if (sync.cfg) setTimeout(runSync, 400);

  /* Two windows of Daybook (a tab and the installed app, or two tabs) share one saved copy. When the other one saves, its notes are merged into
     this one with the same rule sync uses (newest edit wins, deletions stay deleted), so neither window can wipe out the other's notes. */
  window.addEventListener('storage', (e) => {
    if (e.key !== STORE_KEY || !e.newValue) return;
    let d; try { d = JSON.parse(e.newValue); } catch { return; }
    const before = localData(), merged = mergeData(before, cleanRemote(d));
    if (sig(merged) === sig(before)) return;
    const open = activeNote(), wasOpen = ui.activeId;
    const incoming = open && merged.notes.find((n) => n.id === open.id);
    const typing = open && (document.activeElement === el.title || quill.hasFocus());
    if (typing && incoming) merged.notes = merged.notes.map((n) => (n.id === open.id ? open : n));    // what is being typed here is kept
    const changed = open && (!incoming || noteFace(incoming) !== noteFace(open)) && !typing;
    applyMerged(merged);
    if (wasOpen && !findNote(wasOpen)) { ui.activeId = null; renderEditor(); renderList(); setView('list'); }
    else if (changed) renderEditor();
  });
})();
</script>


<script>
/* Installable and offline: the service worker keeps a copy of the app on the device. Only runs on a real web address, not when the file is opened directly. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
/* Ask the browser not to clear the notes when it is short of space. */
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* not available */ }
</script>
