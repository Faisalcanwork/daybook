/* Daybook. Dark only.
   Layout: a top bar, then two panes (note list with search, folders and stats; editor) and a floating New note button.
   Phones turn the two panes into two screens: list first, then editor. */

/* ---------- Tokens ---------- */
:root {
  /* One motion language for the whole app: three speeds and one curve. Things fade, presses dim, only whole screens slide. */
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-fast: 120ms; --t-base: 200ms; --t-slow: 280ms;
  --press: rgba(255, 255, 255, 0.11);
  --bg: #080B12;
  --panel: #111723;
  --surface: #161D2B;
  --ink: #E9EDF5;
  --ink-2: #A3ACBF;
  --line: #263046;

  /* Note colours: six that stay clearly apart.
     Each has a fill and a text colour that reads on it. */
  --blue: #5B93FF;   --on-blue: #0B1230;
  --coral: #FF7A7A;    --on-coral: #2A0C10;
  --amber: #FFC247; --on-amber: #2A1A00;
  --green: #3FD98A;  --on-green: #07200F;
  --violet: #9C8CFF;   --on-violet: #17113A;
  --grey: #8E98AB;   --on-grey: #10151F;

  /* One spacing scale, a 4px grid: every gap and padding is one of these. */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 24px;
  --r-pill: 999px;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "DM Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100dvh; font-size: clamp(16px, calc(21px - 0.6vw), 19px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  height: 100dvh;
  margin: 0;
  padding-block: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 0.875rem;
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; }
kbd { font-family: var(--font-mono); font-size: 0.72rem; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--panel); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 4px 12px; font-size: 0.7812rem; font-weight: 500;
}
.btn:hover { border-color: var(--grey); }
.editor .btn:hover { border-color: var(--nc); }
.btn.solid { background: var(--blue); border-color: var(--blue); color: var(--on-blue); font-weight: 700; }
.btn.danger { color: var(--coral); }
.btn.danger.solid { background: var(--coral); border-color: var(--coral); color: var(--on-coral); }
/* Every round icon button: one size, one look. */
.icon-btn, .folder-add, #saved, .mpin, .mdel { flex: none; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); }
.icon-btn:hover, .folder-add:hover, #saved:hover { background: var(--panel); color: var(--ink); }
.mpin, .mdel { color: var(--grey); }
.mpin:hover { background: var(--panel); color: var(--ink); }
.mdel:hover { background: var(--panel); color: var(--coral); }
.av { flex: none; display: block; }

/* ---------- App shell and top bar ---------- */
.app { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.topbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--bg); }
.brand { flex: none; display: flex; align-items: center; gap: 8px; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.125rem; letter-spacing: -0.01em; }
.topbar-right { margin-left: auto; flex: none; display: flex; align-items: center; gap: 12px; }
.today { font-size: 0.8125rem; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.date-short { display: none; }
.cal-soon { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: var(--r-pill); background: transparent; color: var(--ink-2); padding: 4px 8px; font-size: 0.7812rem; font-weight: 500; cursor: not-allowed; }
.soon { font-family: var(--font-mono); font-size: 0.5938rem; text-transform: uppercase; letter-spacing: 0.06em; background: var(--blue); color: var(--on-blue); padding: 0 4px; border-radius: 3px; }
.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); border-top: 1px solid var(--line); }
.panes > * { min-width: 0; min-height: 0; }

/* ---------- Note list pane ---------- */
/* Laid out like a chat list (Telegram, iMessage): folder tabs on top, then one row per note ordered by recent edit. */
.listpane { display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); }
.listhead { display: flex; flex-direction: column; gap: 0; }
.searchrow { padding: 12px 12px 8px; }
.searchbox { position: relative; display: flex; align-items: center; min-width: 0; }
.searchbox > svg { position: absolute; left: 16px; width: 20px; height: 20px; color: var(--grey); pointer-events: none; transition: color var(--t-fast) var(--ease); }
.searchbox:focus-within > svg { color: var(--blue); }
/* Search: a quiet field with a thin border that turns blue while you type. */
.search { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-pill); padding: 0 40px 0 40px; font-size: 0.875rem; outline: none; transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
.search:hover { border-color: var(--grey); }
.search:focus { border-color: var(--blue); background: var(--bg); }
.search::-webkit-search-cancel-button { display: none; }
.search::placeholder { color: var(--grey); }
.search-clear { position: absolute; right: 8px; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--grey); }
.search-clear:hover { color: var(--ink); }

/* Folder tabs: plain text with a blue underline on the open one, and a small count badge. */
.folder-bar { display: flex; align-items: stretch; min-width: 0; border-bottom: 1px solid var(--line); }
.folder-list { flex: 0 1 auto; display: flex; align-items: stretch; min-width: 0; overflow-x: auto; scrollbar-width: none; padding-left: 8px; }
.folder-list::-webkit-scrollbar { display: none; }
.folder {
  position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; max-width: 170px; padding: 8px 12px 12px; cursor: pointer;
  color: var(--ink-2); font-size: 0.8438rem; font-weight: 600;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.folder::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--blue); opacity: 0; }
.folder:hover { color: var(--ink); }
.folder[aria-selected="true"] { color: var(--blue); }
.folder[aria-selected="true"]::after { opacity: 1; }
.folder-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-count { min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--line); color: var(--ink-2); font-size: 0.6875rem; font-weight: 700; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.folder[aria-selected="true"] .folder-count { background: var(--blue); color: var(--on-blue); }
.folder input { width: 92px; padding: 0; border: 0; border-bottom: 2px solid currentColor; background: transparent; outline: none; font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }

.list { contain: layout style; flex: 1; overflow-y: auto; padding-bottom: 64px; }
.item { position: relative; content-visibility: auto; contain-intrinsic-size: auto 64px; }
.item::after { content: ""; position: absolute; left: 72px; right: 0; bottom: 0; height: 1px; background: var(--line); }
.row {
  width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr); column-gap: 12px; align-items: center; padding: 8px 16px 8px 12px;
  border: 0; background: transparent; text-align: left; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.row { position: relative; }
.row:hover { background: var(--panel); }
.row[aria-current="true"] { background: var(--panel); }
.row[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--nc); }
.row-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row-top, .row-bot { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 0.9375rem; }
.row-time { flex: none; font-size: 0.75rem; color: var(--grey); font-variant-numeric: tabular-nums; }
.row-snip { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-size: 0.8438rem; }
.row-snip b { color: var(--ink); font-weight: 600; }
.pin { flex: none; color: var(--blue); }
.badge { flex: none; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--grey); color: var(--surface); font-size: 0.6875rem; font-weight: 700; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.badge { background: var(--blue); color: var(--on-blue); }
.badge.done { background: var(--line); color: var(--ink-2); }
.stats .warm b { color: var(--blue); }
.av-btn { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: block; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; background: transparent; }
.av-btn:hover .av, .av-btn:focus-visible .av { filter: brightness(1.15); }
.av-btn:focus-visible, #edAvatar:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#edAvatar { display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; }
#edAvatar:hover .av { filter: brightness(1.15); }
.empty-list { padding: 36px 20px; text-align: center; color: var(--ink-2); font-size: 0.8125rem; }
.empty-list strong { display: block; margin-bottom: 4px; font-family: var(--font-display); font-size: 1rem; color: var(--ink); }
.empty-list .btn { margin-top: 16px; padding: 8px 16px; font-size: 0.8125rem; }

.stats { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.stats div { display: flex; flex-direction: column; min-width: 0; padding: 6px 8px; background: var(--panel); }
.stats b { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.stats span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.6875rem; color: var(--grey); }

.fab {
  position: absolute; right: 16px; bottom: 40px; z-index: 5; display: grid; place-items: center; width: 52px; height: 52px; padding: 0;
  border: 0; border-radius: 50%; background: var(--blue); color: var(--on-blue); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
}
.fab.open { visibility: hidden; }   /* the button turns into the menu while it is open */
.fab:hover { filter: brightness(1.08); }
/* On a wide screen the New note button sits in the list column, so it never covers the writing or the toolbar. */
@media (min-width: 901px) { .fab { right: auto; left: 284px; transform: translateX(-100%); bottom: 64px; } }

/* ---------- Editor pane ---------- */
.editor {
  /* --nc is the open note's accent colour and --on-nc is the text colour that reads on it. Set from the note in script. */
  --nc: var(--blue); --on-nc: var(--on-blue);
  display: flex; flex-direction: column;
  background: var(--surface);
}
.editor ::selection { background: color-mix(in srgb, var(--nc) 38%, transparent); }
.ed-top { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 2px solid var(--nc); background: var(--panel); }
.back { display: none; padding: 4px 12px 4px 0; border: 0; background: transparent; color: var(--nc); line-height: 1; }
.ed-head { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.title {
  flex: 1; min-width: 0; width: 100%; margin: 0; padding: 0; border: 0; border-bottom: 2px solid transparent; outline: none; background: transparent; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; line-height: 1.2; letter-spacing: -0.01em;
  -webkit-user-select: text; user-select: text;
}
.title::placeholder { color: var(--grey); }
.title:focus { border-bottom-color: var(--nc); }
.ed-scroll { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 16px 0 8px; scrollbar-color: var(--nc) transparent; }
/* The writing area is as wide as the pane. Text keeps its centred column (48rem, at least 18px from each side) through --px,
   which lets a page break run from the left edge to the right edge. */
.ed-inner { --px: max(var(--edge, 16px), calc((100cqw - 48rem) / 2)); container-type: inline-size; flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; gap: 9px; }
.tools { order: 1; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
.tool { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid transparent; border-radius: var(--r-pill); background: transparent; color: var(--ink-2); font-size: 0.75rem; font-weight: 500; }
.tool:hover { background: var(--surface); color: var(--ink); }
/* Icon buttons, and their pressed state, are circles. Follow is a pill. */
.tool.icon { justify-content: center; width: 36px; height: 36px; min-width: 0; min-height: 0; padding: 0; border-radius: 50%; }
.tool:not(.icon) { min-height: 36px; padding: 0 14px; border-radius: var(--r-pill); }
.tool:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
/* Groups: Text (Heading, Bold, Align), Blocks (Bullet, Checklist, Page break), then Follow on the right. */
.tgroup { display: flex; align-items: center; gap: 2px; }
.tsep { flex: none; width: 1px; height: 20px; margin: 0 6px; background: var(--line); }
@media (max-width: 360px) { .tools { padding-inline: 8px; } .tsep { margin: 0 4px; } }   /* very narrow phones: still one row */
.tool.icon svg { width: 22px; height: 22px; }
.tool[aria-pressed="true"] { background: var(--nc); border-color: var(--nc); color: var(--on-nc); }
.tool[data-cmd="typewriter"] { margin-left: auto; }
/* One slim row on a narrow screen: Follow shows as its icon. */
@media (max-width: 520px) { .tw-label { display: none; } .tool[data-cmd="typewriter"] { width: 36px; height: 36px; min-height: 0; padding: 0; justify-content: center; border-radius: 50%; } }
/* The Toolbar setting: top, bottom, or Follow (bottom while Follow is on, where the text sits at the bottom, top otherwise). */
.ed-top { order: 0; } .ed-scroll { order: 2; } .ed-foot { order: 4; }
.editor[data-tb="bottom"] .tools { order: 3; border-bottom: 0; border-top: 1px solid var(--line); }
.tool:disabled { opacity: 0.35; cursor: default; }
.tool:disabled:hover { border-color: var(--line); color: var(--ink-2); }
.tool[data-cmd="right"] .i-right, .tool[data-cmd="right"][aria-pressed="true"] .i-left { display: none; }
.tool[data-cmd="right"][aria-pressed="true"] .i-right { display: block; }
/* Round keys sit together on the left, Follow on the right; the pressed one is a filled circle. */
.tools { flex-wrap: nowrap; justify-content: flex-start; gap: 6px; }
.tgroup { display: contents; }
.tsep { display: none; }
.tool.icon svg { width: 24px; height: 24px; }
.tool[data-cmd="pagebreak"] { margin-left: auto; }
.tool[data-cmd="typewriter"] { margin-left: 0; }
/* Follow is an icon on every screen; the arrow flips when it is on, like Align. */
.tw-label { display: none; }
.tool[data-cmd="typewriter"] { width: 36px; height: 36px; min-height: 0; padding: 0; justify-content: center; border-radius: 50%; }
.tool[data-cmd="typewriter"][aria-pressed="true"] svg { transform: rotate(180deg); }
.ed-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding: 8px 16px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.6875rem; color: var(--grey); font-variant-numeric: tabular-nums; }
#saved.warn { color: var(--coral); }
#saved.busy { color: var(--ink-2); }
#saved.ok { color: var(--green); }
#saved.busy .up { animation: saveup 0.9s ease-in-out infinite; }
@keyframes saveup { 0%, 100% { transform: translateY(1.2px); opacity: 0.35; } 50% { transform: translateY(-1.2px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #saved.busy .up { animation: none; } }
.blank { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; color: var(--ink-2); }
.blank h2 { margin: 0; font-family: var(--font-display); font-size: 1.1875rem; color: var(--ink); }
.blank p { margin: 0; max-width: 32ch; }

/* ---------- Note text (the editor engine, Quill, builds this markup) ---------- */
.body { position: relative; flex: 1; min-height: 200px; display: flex; flex-direction: column; }
.ql-clipboard { position: absolute; left: -100000px; top: 50%; height: 1px; overflow-y: hidden; }
.ql-editor { flex: 1; min-height: 0; overflow-y: auto; outline: none; white-space: pre-wrap; overflow-wrap: break-word; tab-size: 4;
  padding: 0 var(--px); font-size: 1.25rem; line-height: 1.6; caret-color: var(--nc); counter-reset: list-0; scrollbar-width: thin; }
.ql-editor > * { cursor: text; }
/* Typewriter: a short note sits on the bottom edge of the page, each new line goes in at the bottom and the older lines move up.
   Nothing scrolls until the page is full; after that the page grows and scrolls as usual, following the line you are writing. */
.body.typewriter .ql-editor { display: flex; flex-direction: column; padding-bottom: 1.3rem; }
.body.typewriter .ql-editor > * { flex: none; }
.body.typewriter .ql-editor > :first-child { margin-top: auto; }
.body.typewriter .ql-editor.ql-blank::before { top: auto; bottom: 1.3rem; }
.ql-editor.ql-blank::before { content: attr(data-placeholder); position: absolute; left: 0; right: 0; color: var(--grey); pointer-events: none; }
.ql-editor p, .ql-editor ol, .ql-editor h1, .ql-editor h2, .ql-editor h3 { margin: 0; padding: 0; counter-set: list-0; }
.ql-editor strong { font-weight: 700; }
.ql-editor h1, .ql-editor h2, .ql-editor h3 { margin: 0.5em 0 0.1em; font-family: var(--font-body); font-weight: 600; font-size: 1.6875rem; line-height: 1.3; letter-spacing: -0.01em; padding-bottom: 0.15em; border-bottom: 1px solid var(--nc); }
.ql-editor h1:first-child, .ql-editor h2:first-child, .ql-editor h3:first-child { margin-top: 0; }
.ql-editor li { position: relative; padding-left: 1.5em; list-style-type: none; }
.ql-editor li > .ql-ui { position: absolute; left: 0; top: 0; width: 1.5em; color: var(--nc); }
/* Alignment is Quill's own: the editor's align format puts a class on the line, and these classes do the rest. */
.ql-editor .ql-align-right { text-align: right; }
.ql-editor li.ql-align-right { padding-left: 0; padding-right: 1.5em; }
.ql-editor li.ql-align-right > .ql-ui { left: auto; right: 0; }
/* Page break: one line with a thin note-colour line above and below and the selected-note grey between, edge to edge. */
.ql-editor > div.dv { box-sizing: border-box; margin: 0 calc(-1 * var(--px)); padding: 0 var(--px); border-top: 1px solid var(--nc); border-bottom: 1px solid var(--nc); background: var(--panel); }
.ql-editor li > .ql-ui::before { display: inline-block; width: 1.2em; margin: 0 0.3em 0 0; text-align: right; white-space: nowrap; font-size: 1.1em; }
.ql-editor li[data-list="bullet"] > .ql-ui::before { content: "\2022"; }
.ql-editor li[data-list="unchecked"] > .ql-ui::before { content: "\2610"; }
.ql-editor li[data-list="checked"] > .ql-ui::before { content: "\2611"; }
.ql-editor li[data-list="unchecked"] > .ql-ui, .ql-editor li[data-list="checked"] > .ql-ui { cursor: pointer; }
.ql-editor li[data-list="checked"] { color: var(--grey); text-decoration: line-through; text-decoration-color: var(--nc); text-decoration-thickness: 2px; }
.ql-editor li[data-list="ordered"] { counter-increment: list-0; }
.ql-editor li[data-list="ordered"] > .ql-ui::before { content: counter(list-0, decimal) ". "; }

/* ---------- Options menu (notes and folders) ---------- */
.menu { position: fixed; z-index: 30; width: max(232px, 15rem); display: flex; flex-direction: column; gap: 2px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
.mh { margin-bottom: 4px; padding: 4px 8px 8px; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 0.6875rem; color: var(--grey); }
.mhead { display: flex; align-items: center; gap: 12px; padding: 4px 4px 8px; }
.mav { flex: none; display: block; }
.mtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mtitle b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9062rem; }
.mtitle span { font-size: 0.75rem; color: var(--ink-2); }
.mpin[aria-pressed="true"] { color: var(--blue); }
.mi { padding: 8px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: 0.8438rem; }
.mi:hover { background: var(--panel); }
.menu[data-kind="new"] { width: auto; min-width: 11rem; padding: 6px; border-radius: 24px; }
.mi.preset { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: var(--r-pill); }
.mi.preset b { flex: 1; font-size: 0.875rem; font-weight: 600; }
.pk { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; }
.pk svg { width: 20px; height: 20px; }
.pk-tag { font-family: var(--font-mono); font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey); }
.mi.preset:disabled { opacity: 0.55; cursor: not-allowed; }
.mi.preset:disabled:hover { background: transparent; }
.mi.danger { color: var(--coral); }
.ml { padding: 8px 8px 4px; font-family: var(--font-mono); font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--grey); }
.mnote { padding: 2px 8px 4px; font-size: 0.7812rem; color: var(--ink-2); }
/* Colours: one row of round swatches, a tick on the chosen one. */
.mcolors { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); justify-items: center; gap: 0; padding: 2px 2px 4px; }
.sw { position: relative; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; }
.sw:hover { filter: brightness(1.15); }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.sw[aria-checked="true"]::after { content: ""; position: absolute; left: 50%; top: 46%; width: 5px; height: 10px; margin: -6px 0 0 -2.5px; border: solid var(--ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); mix-blend-mode: normal; }

<script>
(async () => {
  'use strict';
  if (!window.Quill) {
    document.getElementById('blankTitle').textContent = 'The editor could not load';
    document.getElementById('blankText').textContent = 'Check your internet connection and reload the page.';
    document.getElementById('blank').hidden = false;
    return;
  }

  /* ================= Constants ================= */
  const APP_VERSION = '2.0';                           // shown in Settings > About; change it here only
  const STORE_KEY = 'daybook:v3';
  const COLORS = ['blue', 'coral', 'amber', 'green', 'violet', 'grey'];   // in this order in the colour picker
  const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);
  const ALL = 'all';                                   // id of the built-in folder that shows every note
  const TRASH_SVG = `<svg width="20" height="20" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M261-120q-24.8 0-42.4-17.6Q201-155.2 201-180v-570h-11q-12.8 0-21.4-8.7-8.6-8.7-8.6-21.5 0-12.8 8.6-21.3 8.6-8.5 21.4-8.5h158q0-13 8.6-21.5 8.6-8.5 21.4-8.5h204q12.8 0 21.4 8.6Q612-822.8 612-810h158q12.8 0 21.4 8.7 8.6 8.7 8.6 21.5 0 12.8-8.6 21.3-8.6 8.5-21.4 8.5h-11v570q0 24.8-17.6 42.4Q723.8-120 699-120H261Zm438-630H261v570h438v-570ZM418.5-274.6q8.5-8.6 8.5-21.4v-339q0-12.8-8.7-21.4-8.7-8.6-21.5-8.6-12.8 0-21.3 8.6-8.5 8.6-8.5 21.4v339q0 12.8 8.7 21.4 8.7 8.6 21.5 8.6 12.8 0 21.3-8.6Zm166 0q8.5-8.6 8.5-21.4v-339q0-12.8-8.7-21.4-8.7-8.6-21.5-8.6-12.8 0-21.3 8.6-8.5 8.6-8.5 21.4v339q0 12.8 8.7 21.4 8.7 8.6 21.5 8.6 12.8 0 21.3-8.6ZM261-750v570-570Z"/></svg>`;
  let toastTimer = 0;
  /* The same speeds and curve as the CSS, for the few things done in script. A changed row gets a soft wash of its own colour that fades out. */
  const MOTION = { base: 200, slow: 280, wash: 900, ease: 'cubic-bezier(0.2, 0.8, 0.2, 1)' };
  const WASH = [{ backgroundColor: 'color-mix(in srgb, var(--nc) 30%, transparent)' }, { backgroundColor: 'transparent' }];
  /* A short message at the top for every major action, so you always see that something happened. */
  function toast(msg) {
    const t = document.getElementById('toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  const PIN_SVG = `<svg width="20" height="20" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M634-780v332l77 68q5 5 7 10.6 2 5.6 2 11.6v17.2q0 12.7-8.6 21.2-8.6 8.5-21.4 8.5H510v236q0 12.8-8.7 21.4-8.7 8.6-21.5 8.6-12.8 0-21.3-8.6Q450-62.2 450-75v-236H270q-12.8 0-21.4-8.6-8.6-8.6-8.6-21.3v-17.2q0-6 2-11.5 2-5.5 7-10.5l71-68v-332h-20q-12.8 0-21.4-8.7-8.6-8.7-8.6-21.5 0-12.8 8.6-21.3 8.6-8.5 21.4-8.5h354q12.8 0 21.4 8.7 8.6 8.7 8.6 21.5 0 12.8-8.6 21.3-8.6 8.5-21.4 8.5h-20ZM321-371h312l-59-55v-354H380v354l-59 55Zm156 0Z"/></svg>`;
  const PIN_ICON = '<svg class="pin" width="18" height="18" viewBox="0 -960 960 960" fill="currentColor" aria-label="Pinned"><path d="M634-780v332l77 68q5 5 7 10.6 2 5.6 2 11.6v17.2q0 12.7-8.6 21.2-8.6 8.5-21.4 8.5H510v236q0 12.8-8.7 21.4-8.7 8.6-21.5 8.6-12.8 0-21.3-8.6Q450-62.2 450-75v-236H270q-12.8 0-21.4-8.6-8.6-8.6-8.6-21.3v-17.2q0-6 2-11.5 2-5.5 7-10.5l71-68v-332h-20q-12.8 0-21.4-8.7-8.6-8.7-8.6-21.5 0-12.8 8.6-21.3 8.6-8.5 21.4-8.5h354q12.8 0 21.4 8.7 8.6 8.7 8.6 21.5 0 12.8-8.6 21.3-8.6 8.5-21.4 8.5h-20Z"/></svg>';
  const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
  const USER = Quill.sources.USER, SILENT = Quill.sources.SILENT;

  /* Where notes are kept. The browser's small settings box (localStorage) holds about 5 MB; IndexedDB holds far more, so notes live there.
     Notes saved by an older version in localStorage are moved over once. If IndexedDB is blocked, localStorage is used as before. */
  const DB = {
    db: null,
    open() {
      return new Promise((done) => {
        try {
          const r = indexedDB.open('daybook', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => { DB.db = r.result; done(true); };
          r.onerror = r.onblocked = () => done(false);
        } catch { done(false); }
      });
    },
    get(k) {
      return new Promise((done) => {
        try { const q = DB.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => done(q.result); q.onerror = () => done(undefined); } catch { done(undefined); }
      });
    },
    put(k, v) {
      return new Promise((done) => {
        try { const t = DB.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => done(true); t.onerror = t.onabort = () => done(false); } catch { done(false); }
      });
    }
  };
  const useDB = await DB.open();
  let bootRaw = useDB ? await DB.get(STORE_KEY) : undefined;
  if (typeof bootRaw !== 'string') {
    bootRaw = null;
    try { bootRaw = localStorage.getItem(STORE_KEY); } catch { /* blocked */ }
    if (useDB && bootRaw !== null && await DB.put(STORE_KEY, bootRaw)) { try { localStorage.removeItem(STORE_KEY); } catch { /* ignore */ } }   // moved over: the old copy is removed so it does not take the space
  }
  const channel = useDB && 'BroadcastChannel' in window ? new BroadcastChannel('daybook') : null;   // tells other open windows that notes were saved

  /* ================= Small helpers ================= */
  const $ = (id) => document.getElementById(id);
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const isObj = (v) => v !== null && typeof v === 'object';
  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const str = (v) => (typeof v === 'string' ? v : '');
  /* Anything that arrives from storage or sync is checked before it is used: ids may only be letters, numbers, - and _ (they end up inside the page's markup), and a note colour must be one of ours. */
  const safeId = (v) => typeof v === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(v);
  /* Formatters are made once; building one per call is slow when a list has hundreds of rows. */
  const fmtTime = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  const fmtDay = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
  const fmtShort = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });
  const shortDate = (ms) => fmtShort.format(ms);

  /* ================= State and storage ================= */
  /* One object holds everything that is saved:
     notes:   { id, title, content, color, pinned, created, updated, meta, folders? }   (updated = last time the TEXT was written: orders the list. meta = last time title, colour, pin or folders changed: used only so sync picks the right copy)   (folders: ids of every folder the note is in; none = only under All)
              content is the editor's own format (a list of text pieces with their formatting), so bold, headings and lists
              are real formatting and never characters inside the text.
     folders: { id, name }     (the built-in "All" folder is not stored; only its name)
     settings: typewriter, shortcutsOn, shortcuts { commandId: { code, alt?, shift? } } */
  const store = {
    ok: true,
    timer: 0,
    status: 'saved',
    since: 0,
    done: 0,
    show: () => {},
    /* Shows "saving" at once, and "saved" only after the saving icon has been visible for a moment. */
    mark(st) {
      clearTimeout(this.done);
      if (st === 'saving') { if (this.status !== 'saving') this.since = Date.now(); this.status = 'saving'; this.show(); return; }
      const wait = this.status === 'saving' ? Math.max(0, 600 - (Date.now() - this.since)) : 0;
      this.done = setTimeout(() => { this.status = 'saved'; this.show(); }, wait);
    },
    after: () => {},
    size: 0,
    writing: false,
    pending: null,
    /* Saves are written one at a time; if more arrive while one is being written, only the newest is kept. */
    save(quiet) {
      clearTimeout(this.timer); this.timer = 0;
      this.mark('saving');
      this.pending = JSON.stringify(state);
      this.size = this.pending.length;
      this.drain();
      if (!quiet) this.after();
    },
    async drain() {
      if (this.writing) return;
      this.writing = true;
      while (this.pending !== null) {
        const json = this.pending; this.pending = null;
        if (useDB) this.ok = await DB.put(STORE_KEY, json);
        else { try { localStorage.setItem(STORE_KEY, json); this.ok = true; } catch { this.ok = false; } }
        if (this.ok && channel) channel.postMessage(json);
      }
      this.writing = false;
      this.mark('saved');
    },
    saveSoon() { clearTimeout(this.timer); this.mark('saving'); this.timer = setTimeout(() => this.save(), 300); },
    flush() { if (this.timer) this.save(); }
  };

  /* The editor needs its content to end with a new line. */
  function cleanContent(v) {
    const ops = Array.isArray(v) ? v.filter((op) => isObj(op) && typeof op.insert === 'string') : [];
    const last = ops[ops.length - 1];
    if (!last || typeof last.insert !== 'string' || !last.insert.endsWith('\n')) ops.push({ insert: '\n' });
    return ops;
  }
  function cleanNote(raw, folderIds) {
    if (!isObj(raw) || !safeId(raw.id)) return null;
    const updated = isNum(raw.updated) ? raw.updated : Date.now();
    const note = {
      id: raw.id, title: str(raw.title), content: cleanContent(raw.content),
      color: COLORS.includes(raw.color) ? raw.color : 'blue',
      pinned: raw.pinned === true,
      ...(raw.kind === 'list' && { kind: 'list' }),     // 'list' notes only hold bullet and checklist lines; anything else is a plain note
      created: isNum(raw.created) ? raw.created : updated,
      updated,
      meta: isNum(raw.meta) ? raw.meta : updated
    };
    const inFolders = (Array.isArray(raw.folders) ? [...new Set(raw.folders)] : []).filter((f) => folderIds.has(f));
    if (inFolders.length) note.folders = inFolders;
    return note;
  }
  function cleanShortcuts(raw) {
    const out = {};
    if (isObj(raw)) for (const [id, c] of Object.entries(raw)) {
      if (isObj(c) && typeof c.code === 'string') out[id] = { code: c.code, ...(c.alt && { alt: true }), ...(c.shift && { shift: true }) };
    }
    return out;
  }
  function load() {
    const s = { notes: [], folders: [], gone: {}, allName: 'All', settings: { typewriter: true, toolbar: 'typewriter', defaultKind: 'notes', shortcutsOn: true, shortcuts: {} } };
    let raw = null;
    try { raw = JSON.parse(bootRaw); store.size = bootRaw ? bootRaw.length : 0; }
    catch (e) { if (!(e instanceof SyntaxError)) store.ok = false; }
    if (!isObj(raw)) return s;
    if (Array.isArray(raw.folders)) s.folders = raw.folders.filter((f) => isObj(f) && safeId(f.id) && str(f.name).trim()).map((f) => ({ id: f.id, name: f.name, updated: isNum(f.updated) ? f.updated : 0 }));
    if (isObj(raw.gone)) for (const [k, v] of Object.entries(raw.gone)) if (safeId(k) && isNum(v)) s.gone[k] = v;   // ids deleted on purpose, so sync does not bring them back
    if (str(raw.allName).trim()) s.allName = raw.allName;
    const folderIds = new Set(s.folders.map((f) => f.id));
    if (Array.isArray(raw.notes)) s.notes = raw.notes.map((n) => cleanNote(n, folderIds)).filter(Boolean);
    if (isObj(raw.settings)) {
      s.settings.typewriter = raw.settings.typewriter !== false;
      if (['notes', 'list'].includes(raw.settings.defaultKind)) s.settings.defaultKind = raw.settings.defaultKind;
      if (['top', 'bottom', 'typewriter'].includes(raw.settings.toolbar)) s.settings.toolbar = raw.settings.toolbar;
      s.settings.shortcutsOn = raw.settings.shortcutsOn !== false;
      s.settings.shortcuts = cleanShortcuts(raw.settings.shortcuts);
    }
    return s;
  }
  const state = load();
  const settings = state.settings;

  /* Cloud sync: Daybook talks to a small Google Apps Script that keeps one file in your own Drive. */
  const SYNC_KEY = 'daybook:sync';
  const sync = { cfg: null, status: 'idle', err: '', busy: false, again: false, timer: 0 };
  try {
    const c = JSON.parse(localStorage.getItem(SYNC_KEY));
    if (isObj(c) && /^https:\/\//.test(str(c.url)) && str(c.key)) sync.cfg = { url: c.url, key: c.key, last: isNum(c.last) ? c.last : 0 };
  } catch { /* no sync set up */ }

  /* What is on screen right now. Not saved. */
  const ui = { activeId: null, folder: ALL, query: '', renaming: null };

  /* ================= Selectors ================= */
  const findNote = (id) => state.notes.find((n) => n.id === id);
  const findFolder = (id) => state.folders.find((f) => f.id === id);
  const folderLabel = (id) => (id === ALL ? state.allName : findFolder(id)?.name);
  const activeNote = () => findNote(ui.activeId);

  /* Plain text, word count and task counts of a note, worked out from its content once per change. */
  const infoCache = new WeakMap();
  function info(n) {
    let i = infoCache.get(n.content);
    if (!i) {
      let text = '', total = 0, done = 0;
      for (const op of n.content) {
        if (typeof op.insert !== 'string') { text += '\n'; continue; }
        text += op.insert;
        const lines = (op.insert.match(/\n/g) || []).length, list = op.attributes?.list;
        if (lines && (list === 'checked' || list === 'unchecked')) { total += lines; if (list === 'checked') done += lines; }
      }
      text = text.replace(/\n+$/, '');
      const t = text.trim();
      i = { text, total, done, words: t ? t.split(/\s+/).length : 0 };
      infoCache.set(n.content, i);
    }
    return i;
  }

  function visibleNotes() {
    const q = ui.query.trim().toLowerCase();
    return state.notes
      .filter((n) => (ui.folder === ALL || n.folders?.includes(ui.folder)) && (!q || `${n.title}\n${info(n).text}`.toLowerCase().includes(q)))
      .sort((a, b) => (a.pinned !== b.pinned ? (a.pinned ? -1 : 1) : b.updated - a.updated));
  }

  /* ================= Text helpers ================= */
  const snippet = (n) => {
    const lines = info(n).text.slice(0, 400).split('\n').map((l) => l.trim()).filter(Boolean);
    return lines.length ? lines.join(' · ') : 'No text yet';
  };
  function ago(ms) {
    const m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h} h ago`;
    const d = Math.round(h / 24);
    return d < 7 ? `${d} d ago` : shortDate(ms);
  }
  const avatar = (n, px) => {
    const ch = n.title.trim().charAt(0).toUpperCase() || 'N';
    return `<svg class="av" width="${px}" height="${px}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" style="fill:var(--${n.color})"/>` +
      `<text x="20" y="20.5" text-anchor="middle" dominant-baseline="central" style="fill:var(--on-${n.color});font-family:var(--font-display);font-weight:700;font-size:18px">${esc(ch)}</text></svg>`;
  };

  /* ================= The editor ================= */
  /* Quill does the writing: bold, headings, bullet and checklist items, Enter, Backspace, Undo, paste.
     Typing "# ", "- ", "[ ] " or "1. " at the start of a line starts a heading or list, the way other note apps do. */
  /* A page break is a normal line with a note-colour line above and below it (see the CSS), so the cursor, Backspace and selection all behave as on any line. */
  const Block = Quill.import('blots/block');
  class Divider extends Block { static blotName = 'divider'; static tagName = 'div'; static className = 'dv'; }
  Quill.register(Divider);
  const quill = new Quill('#body', {
    placeholder: 'Start writing…',
    formats: ['bold', 'header', 'list', 'align', 'divider'],
    modules: {
      toolbar: false,
      history: { userOnly: true, delay: 800 },
      keyboard: {
        bindings: {
          bold: null, italic: null, underline: null,       // Bold comes from our own shortcut list, so it can be changed or switched off
          'heading autofill': {
            key: ' ', collapsed: true, format: { header: false, list: false }, prefix: /^#$/,
            handler(range) {
              this.quill.history.cutoff();
              this.quill.deleteText(range.index - 1, 1, USER);
              this.quill.formatLine(range.index - 1, 1, 'header', 1, USER);
              this.quill.history.cutoff();
              return false;
            }
          }
        }
      }
    }
  });
  const root = quill.root;

  /* Word, Notion and Evernote keep bold going on the next line when you press Enter in the middle of bold writing; Quill does not.
     This binding goes first, lets Quill make the new line, then turns bold back on for it. */
  quill.keyboard.addBinding({ key: 'Enter', collapsed: true, format: ['bold'] }, () => {
    queueMicrotask(() => quill.format('bold', true, USER));
    return true;
  });
  const first = (key) => quill.keyboard.bindings[key].unshift(quill.keyboard.bindings[key].pop());   // addBinding adds at the end; this moves the newest binding to the front so it runs first
  first('Enter');

  /* Page break lines: Backspace or Delete next to one removes it, and Enter on one starts an ordinary line below. */
  const isDivider = (line) => !!line && line.statics.blotName === 'divider';
  const dropLine = (line) => { quill.history.cutoff(); quill.deleteText(quill.getIndex(line), line.length(), USER); quill.history.cutoff(); };
  quill.keyboard.addBinding({ key: 'Backspace', collapsed: true, offset: 0 }, (range) => {
    const [line] = quill.getLine(range.index);
    if (isDivider(line)) { if (line.length() <= 1) dropLine(line); else quill.formatLine(range.index, 1, 'divider', false, USER); return false; }
    const [prev] = range.index ? quill.getLine(range.index - 1) : [null];
    if (isListNote() && !isDivider(prev)) return listBackspace(range, prev);
    if (!isDivider(prev)) return true;
    const n = prev.length(); dropLine(prev); quill.setSelection(range.index - n, 0, USER); return false;
  });
  first('Backspace');
  quill.keyboard.addBinding({ key: 'Delete', collapsed: true, suffix: /^$/ }, (range) => {
    const [line] = quill.getLine(range.index);
    if (isDivider(line) && line.length() <= 1) { dropLine(line); return false; }
    const [next] = quill.getLine(range.index + 1);
    if (!isDivider(next) || next === line) return true;
    dropLine(next); return false;
  });
  first('Delete');
  /* List notes: every line is a bullet or a checklist item (or a page break), and it can never be switched off. */
  const isListNote = () => activeNote()?.kind === 'list';
  const LIST_OK = new Set(['bullet', 'check', 'pagebreak']);               // the only tools that stay on in a list note
  let enforcing = false;
  /* Any line that is not a list item or a page break becomes one (after paste, undo, or text from another device). It takes the type of the line above. */
  function enforceList(source) {
    const todo = []; let type = 'unchecked';
    for (const line of quill.getLines()) {
      if (isDivider(line)) continue;
      const i = quill.getIndex(line), cur = quill.getFormat(i, 0).list;
      if (cur === 'bullet' || cur === 'checked' || cur === 'unchecked') type = cur === 'bullet' ? 'bullet' : 'unchecked';
      else todo.push([i, type]);
    }
    enforcing = true;
    try { for (const [i, t] of todo) quill.formatLine(i, 1, 'list', t, source); } finally { enforcing = false; }
    return todo.length > 0;
  }
  /* Bullet and Checklist in a list note switch the line between the two. Pressing the active one does nothing, so a line can never lose its list. */
  function setListType(value) {
    const r = curRange();
    quill.history.cutoff();
    const at = quill.getLines(r.index, r.length || 1).filter((l) => !isDivider(l)).map((l) => quill.getIndex(l));
    for (const i of at) {
      const cur = quill.getFormat(i, 0).list;
      if (value === 'bullet' ? cur !== 'bullet' : (cur !== 'checked' && cur !== 'unchecked')) quill.formatLine(i, 1, 'list', value, USER);
    }
    quill.history.cutoff();
    syncTools();
  }
  /* Backspace at the start of a list item joins it onto the item above (an empty item simply disappears); the item above keeps its own type. The first item stays. */
  function listBackspace(range, prev) {
    if (!prev) return false;
    quill.history.cutoff();
    const keep = quill.getFormat(quill.getIndex(prev), 0).list;
    const at = quill.getIndex(prev) + prev.length() - 1;
    quill.deleteText(at, 1, USER);
    quill.formatLine(at, 1, 'list', keep, USER);
    quill.setSelection(at, 0, USER);
    quill.history.cutoff();
    return false;
  }
  quill.keyboard.addBinding({ key: 'Enter', collapsed: true, empty: true, format: ['list'] }, () => !isListNote());   // Enter on an empty item does nothing in a list note (it would normally end the list)
  first('Enter');
  quill.keyboard.addBinding({ key: 'Enter', collapsed: true, format: ['divider'] }, (range) => {
    quill.insertText(range.index, '\n', USER); quill.formatLine(range.index + 1, 1, 'divider', false, USER); quill.setSelection(range.index + 1, 0, USER); return false;
  });
  first('Enter');

  /* Safety net: if the browser ever refuses a cursor position (IndexSizeError), keep going instead of throwing. */
  const setNativeRange = quill.selection.setNativeRange.bind(quill.selection);
  let noFocus = false;   // while true, Quill may not move the cursor into the text (that would focus it, and a phone would open the keyboard)
  quill.selection.setNativeRange = (...args) => { if (noFocus) return undefined; try { return setNativeRange(...args); } catch (e) { if (e instanceof DOMException) return undefined; throw e; } };

  /* Formatting at the cursor, kept for the toolbar. It is read again after every selection or content change. */
  let fmt = {};
  /* The toolbar works on the last place the cursor was and never moves focus into the text. On a phone, focusing the text opens the keyboard,
     so a toolbar tap must not do it: with the keyboard closed the keyboard stays closed, and with it open it stays open. */
  let lastSel = { index: 0, length: 0 };
  const curRange = () => {
    const r = quill.getSelection() || lastSel, max = Math.max(0, quill.getLength() - 1), index = Math.min(r.index, max);
    return { index, length: Math.min(r.length, max - index) };
  };
  const isHeading = () => typeof fmt.header === 'number';
  const typewriterOn = () => settings.typewriter;

  function bold() {
    const r = curRange();
    quill.history.cutoff();                              // each button press is its own step in Undo
    const on = quill.getFormat(r.index, r.length).bold !== true;
    if (r.length) quill.formatText(r.index, r.length, 'bold', on, USER);
    else if (quill.hasFocus()) quill.format('bold', on, USER);                 // with only a cursor, bold applies to what you type next, which needs the cursor in the text
    syncTools();
  }
  /* Heading, Bullet, Checklist: a property of the whole line. The same button again takes it off.
     With several lines selected, it is "on" only when every line has it, so a mixed selection gets it on all lines first. */
  function lineFormat(name, value, isOn) {
    const r = curRange();
    quill.history.cutoff();
    quill.formatLine(r.index, r.length, name, isOn(quill.getFormat(r.index, r.length)) ? false : value, USER);
    syncTools();
  }
  /* Right: the line is attached to the right edge (writing still runs left to right). Same button again takes it off. Like Heading and Bullet, it is "on" only when every selected line has it. */
  const isRight = () => fmt.align === 'right';
  function toggleRight() {
    const r = curRange();
    quill.history.cutoff();
    const off = quill.getFormat(r.index, r.length).align === 'right';
    quill.formatLine(r.index, r.length, 'align', off ? false : 'right', USER);
    syncTools();
  }
  /* Page break: puts a divider line at the cursor and moves on to the line below it. */
  function pageBreak() {
    const r = curRange();
    quill.history.cutoff();
    const at = r.index + r.length;                       // with text selected, the break goes right after the selection and the text is kept
    quill.insertText(at, '\n\n', USER);
    quill.formatLine(at + 1, 1, 'divider', true, USER);
    if (quill.hasFocus()) quill.setSelection(at + 2, 0, USER); else lastSel = { index: at + 2, length: 0 };   // no focus: remember the place, do not open the keyboard
    quill.history.cutoff();
    syncTools(); followEnd();
  }
  /* Toolbar and shortcut commands. If the text is not focused (keyboard closed on a phone) they still work, on the last cursor place, without focusing it. */
  const runCommand = (id) => {
    if (isListNote() && !LIST_OK.has(id)) return;
    if (quill.hasFocus()) return COMMANDS[id].run();
    noFocus = true;
    try { COMMANDS[id].run(); } finally { noFocus = false; }
  };   // the greyed-out tools also ignore their shortcuts
  function toggleTypewriter() { settings.typewriter = !settings.typewriter; store.save(); syncTools(); applyTypewriter(true); }

  /* One list of commands drives the toolbar buttons and the keyboard shortcuts. */
  const COMMANDS = {
    heading:    { label: 'Heading',   def: { code: 'Digit1', alt: true },   isOn: isHeading,                                    run: () => lineFormat('header', 1, (f) => typeof f.header === 'number') },
    bold:       { label: 'Bold',      def: { code: 'KeyB' },                isOn: () => fmt.bold === true,                    run: bold },
    right:      { label: 'Align',     def: { code: 'KeyR', alt: true },   isOn: isRight,                                       run: toggleRight },
    bullet:     { label: 'Bullet',    def: { code: 'KeyL', shift: true },   isOn: () => fmt.list === 'bullet',                  run: () => (isListNote() ? setListType('bullet') : lineFormat('list', 'bullet', (f) => f.list === 'bullet')) },
    check:      { label: 'Checklist', def: { code: 'Digit9', shift: true }, isOn: () => fmt.list === 'checked' || fmt.list === 'unchecked', run: () => (isListNote() ? setListType('unchecked') : lineFormat('list', 'unchecked', (f) => f.list === 'checked' || f.list === 'unchecked')) },
    pagebreak:  { label: 'Page break', def: { code: 'Enter' },             isOn: () => false,                                run: pageBreak },
    typewriter: { label: 'Follow',                                          isOn: typewriterOn,                                 run: toggleTypewriter }
  };
  const SHORTCUT_IDS = Object.keys(COMMANDS).filter((id) => COMMANDS[id].def);

  function syncTools() {
    const r = curRange();
    fmt = quill.getFormat(r.index, r.length);
    const list = activeNote()?.kind === 'list';
    $('tools').querySelectorAll('[data-cmd]').forEach((b) => {
      b.setAttribute('aria-pressed', String(COMMANDS[b.dataset.cmd].isOn()));
      b.disabled = list && !LIST_OK.has(b.dataset.cmd);                      // list notes: everything but Bullet, Checklist and Page break is greyed out
    });
  }

  /* Typewriter is mostly layout (see the CSS). The one job left for script: once the page is full and scrolls, keep the line being written
     at the bottom. It only follows when the cursor is at the end, so editing older text works like a normal editor. */
  const atEnd = () => { const r = quill.getSelection(); return !r || r.index + r.length >= quill.getLength() - 1; };
  const toEnd = () => { root.scrollTop = root.scrollHeight; };
  const TB_NAME = { top: 'Top', bottom: 'Bottom', typewriter: 'Follow' };
  const DK_NAME = { notes: 'Notes', list: 'List', chat: 'Chat' };
  function applyDefaultKind() {
    $('dkState').textContent = DK_NAME[settings.defaultKind];
    $('dkSeg').querySelectorAll('button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.dk === settings.defaultKind)));
  }
  function applyToolbar() {
    el.editor.dataset.tb = settings.toolbar === 'bottom' || (settings.toolbar === 'typewriter' && typewriterOn()) ? 'bottom' : 'top';
    $('tbState').textContent = TB_NAME[settings.toolbar]; applyDefaultKind();
    $('tbSeg').querySelectorAll('button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.tb === settings.toolbar)));
  }
  function applyTypewriter(jumpToEnd) {
    $('body').classList.toggle('typewriter', typewriterOn());
    applyToolbar();
    if (jumpToEnd && typewriterOn()) toEnd();
  }
  const followEnd = () => requestAnimationFrame(() => { if (typewriterOn() && atEnd()) toEnd(); });   // after the browser has moved the cursor

  quill.on('text-change', (delta, old, source) => {
    if (source === SILENT || enforcing) return;
    const n = activeNote(); if (!n) return;
    if (n.kind === 'list') enforceList(Quill.sources.API);
    n.content = quill.getContents().ops;
    touch(n); syncTools(); followEnd();
  });
  quill.on('selection-change', (range) => { if (range) lastSel = { index: range.index, length: range.length }; syncTools(); });

  /* ================= Rendering ================= */
  const el = {
    app: $('app'), folders: $('folders'), list: $('list'), stats: $('stats'),
    title: $('title'), tools: $('tools'), editor: $('editor'), blank: $('blank'), search: $('search'), menu: $('menu'), dlg: $('dlg')
  };

  function renderToday() {
    const d = new Date();
    const f = (weekday, month) => d.toLocaleDateString(undefined, { weekday, day: 'numeric', month });
    $('today').innerHTML = `<span class="date-long">${esc(f('long', 'long'))}</span><span class="date-short">${esc(f('short', 'short'))}</span>`;
  }

  function renderFolders() {
    const counts = new Map();
    state.notes.forEach((n) => n.folders?.forEach((f) => counts.set(f, (counts.get(f) || 0) + 1)));
    const items = [{ id: ALL, name: state.allName, count: state.notes.length }, ...state.folders.map((f) => ({ id: f.id, name: f.name, count: counts.get(f.id) || 0 }))];
    const fhtml = items.map((f) => {
      const inner = ui.renaming === f.id
        ? `<input id="folderInput" type="text" maxlength="24" value="${esc(f.name)}" aria-label="Folder name">`
        : `<span class="folder-name">${esc(f.name)}</span><span class="folder-count">${f.count}</span>`;
      return `<div class="folder" role="tab" tabindex="0" data-folder="${f.id}" aria-selected="${ui.folder === f.id}">${inner}</div>`;
    }).join('');
    if (el.folders._h !== fhtml) { el.folders.innerHTML = fhtml; el.folders._h = fhtml; }
    if (ui.renaming) { const input = $('folderInput'); if (input && document.activeElement !== input) { input.focus(); input.select(); } }
  }

  /* Overview under the list: follows the folder that is open. "Edited" means the text was written in (not a colour, pin or folder change). */
  function renderStats() {
    const today = dayKey(Date.now()), weekAgo = Date.now() - 7 * 864e5;
    let open = 0, words = 0, newToday = 0, editedToday = 0, editedWeek = 0;
    for (const n of state.notes) {
      if (ui.folder !== ALL && !n.folders?.includes(ui.folder)) continue;
      const i = info(n); open += i.total - i.done; words += i.words;
      if (dayKey(n.created) === today) newToday++;
      if (dayKey(n.updated) === today) editedToday++;
      if (n.updated >= weekAgo) editedWeek++;
    }
    const cell = (v, label) => `<div><b>${v}</b><span>${label}</span></div>`;
    const shtml = cell(newToday, 'New') + cell(editedToday, 'Edited') + cell(editedWeek, '7 days') + cell(open, 'Tasks').replace('<div>', open ? '<div class="warm">' : '<div>') + cell(words.toLocaleString(), 'Words');
    if (el.stats._h !== shtml) { el.stats.innerHTML = shtml; el.stats._h = shtml; }
  }

  /* The list is grouped by day (Pinned, Today, Yesterday, ...) the way most note apps do, by the date each note was last edited, the only order (newest first, pinned on top), like a messaging app. */
  const noteDate = (n) => n.updated;
  function rowTime(n) {
    const ms = noteDate(n), now = Date.now();
    if (dayKey(ms) === dayKey(now)) return fmtTime.format(ms);
    return now - ms < 7 * 864e5 ? fmtDay.format(ms) : shortDate(ms);
  }

  const motionOK = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
  function renderList() {
    const notes = visibleNotes();
    $('searchClear').hidden = !ui.query;
    if (!notes.length) {
      const [title, text, action, label] = ui.query
        ? ['Nothing found', 'Try a different word.', 'clear', 'Clear search']
        : state.notes.length
          ? ['This folder is empty', 'Write a note and it will be saved in here.', 'new', 'New note']
          : ['A clean page', 'Write your first note. It saves on this device, even offline.', 'new', 'Write a note'];
      el.list.innerHTML = `<li class="empty-list"><strong>${title}</strong>${text}<br><button class="btn solid" type="button" data-empty="${action}">${label}</button></li>`;
      return;
    }
    /* Rows are kept between renders. Only a row whose text changed is rebuilt, the rest are just put in the right order,
       so opening a note or typing never rebuilds the whole list. Rows that move glide to their new place. */
    if (!el.list.firstElementChild?.dataset.nid) el.list.textContent = '';
    const have = new Map();
    for (const li of el.list.children) have.set(li.dataset.nid, li);
    /* Rows only glide when the order changes or a row is added, so a redraw that changes nothing never forces the browser to measure every row. */
    let sameOrder = have.size === notes.length;
    if (sameOrder) { let k = 0; for (const n of notes) { if (el.list.children[k++]?.dataset.nid !== n.id) { sameOrder = false; break; } } }
    const smooth = motionOK() && have.size > 0 && have.size <= 300 && !sameOrder;
    const before = smooth ? new Map([...have].map(([id, li]) => [id, li.offsetTop])) : null;
    const tpl = document.createElement('template');
    const next = [], fresh = new Set();
    for (const n of notes) {
      const i = info(n);
      const folder = ui.folder === ALL && n.folders ? n.folders.map(folderLabel).join(', ') : '';
      const badge = i.total ? `<span class="badge${i.done === i.total ? ' done' : ''}" title="${i.done} of ${i.total} tasks done">${i.done}/${i.total}</span>` : '';
      const name = n.title || untitled(n);
      const html = `<li class="item" data-nid="${n.id}" style="--nc:var(--${n.color});--on-nc:var(--on-${n.color})"><button class="row" type="button" data-id="${n.id}" aria-current="${n.id === ui.activeId}"><span class="av-gap"></span><span class="row-main">` +
        `<span class="row-top"><span class="row-title">${esc(name)}</span><span class="row-time">${esc(rowTime(n))}</span></span>` +
        `<span class="row-bot"><span class="row-snip">${folder ? `<b>${esc(folder)}</b> ` : ''}${esc(snippet(n))}</span>${badge}${n.pinned ? PIN_ICON : ''}</span></span></button>` +
        `<button class="av-btn" type="button" data-more="${n.id}" aria-label="Options for ${esc(name)}" title="Options">${avatar(n, 48)}</button></li>`;
      let li = have.get(n.id);
      if (!li || li._h !== html) {
        tpl.innerHTML = html;
        const made = tpl.content.firstElementChild; made._h = html;
        if (li) li.replaceWith(made); else if (have.size) fresh.add(n.id);
        li = made;
        if (ui.pulse === n.id && motionOK()) { ui.pulse = null; requestAnimationFrame(() => li.animate(WASH, { duration: MOTION.wash, easing: MOTION.ease })); }
      }
      next.push(li);
    }
    let ref = el.list.firstChild;
    for (const li of next) { if (li === ref) ref = ref.nextSibling; else el.list.insertBefore(li, ref); }
    while (ref) { const gone = ref; ref = ref.nextSibling; gone.remove(); }
    if (smooth) {
      const lh = el.list.clientHeight;
      for (const li of next) {
        if (fresh.has(li.dataset.nid)) { li.animate([{ opacity: 0 }, { opacity: 1 }], { duration: MOTION.base, easing: MOTION.ease }); continue; }
        const was = before.get(li.dataset.nid); if (was === undefined) continue;
        const d = was - li.offsetTop;
        if (d && Math.abs(d) < lh * 1.5) li.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: MOTION.slow, easing: MOTION.ease });
      }
    }
  }

  const CLOUD = '<path d="M5.2 14.5a3.2 3.2 0 0 1-.4-6.4 4.4 4.4 0 0 1 8.4 1 2.7 2.7 0 0 1-.4 5.4z"/>';
  const UP = CLOUD + '<path class="up" d="M9 12.8V8.2M7.2 9.9L9 8.2l1.8 1.7"/>';
  const CHECK = CLOUD + '<path d="M6.8 10.8l1.7 1.7 3-3.2"/>';
  const SAVE_ICON = {
    saved: CHECK, synced: CHECK, saving: UP, syncing: UP,
    failed: CLOUD + '<path d="M7.5 8.5l3 3M10.5 8.5l-3 3"/>',
    offline: CLOUD + '<path d="M3.5 3.5l11 11"/>',
    syncerr: CLOUD + '<path d="M9 7.6v2.4M9 12.2v.1"/>'
  };
  function paintSaved() {
    const saved = $('saved');
    let kind = 'saved';
    if (!store.ok) kind = 'failed';
    else if (store.status === 'saving') kind = 'saving';
    else if (sync.cfg) kind = sync.status === 'syncing' ? 'syncing' : sync.status === 'offline' ? 'offline' : sync.status === 'error' ? 'syncerr' : 'synced';
    const msg = {
      failed: 'Not saved: browser storage is blocked or full',
      saving: 'Saving…',
      saved: 'Saved in this browser',
      syncing: 'Syncing…',
      synced: 'Saved and synced with Google Drive',
      offline: 'Offline. Saved here, will sync when you are back online',
      syncerr: `Sync problem: ${sync.err || 'could not reach Google Drive'}. Tap to try again`
    }[kind];
    saved.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SAVE_ICON[kind]}</svg>`;
    saved.title = msg; saved.setAttribute('aria-label', msg);
    saved.className = kind === 'failed' || kind === 'syncerr' ? 'warn' : kind === 'saving' || kind === 'syncing' ? 'busy' : kind === 'synced' ? 'ok' : '';
  }
  store.show = paintSaved;
  function renderFooter(n) {
    const i = info(n);
    $('count').textContent = [`${i.words} words`, `${i.text.length.toLocaleString()} characters`, i.total && `${i.done} of ${i.total} tasks done`, `created ${ago(n.created)}`, `edited ${ago(n.updated)}`].filter(Boolean).join(' · ');
    paintSaved();
  }

  const untitled = (n) => (n.kind === 'list' ? 'Untitled list' : 'Untitled note');   // what an empty title shows
  function renderEditor() {
    const n = activeNote();
    el.blank.hidden = !!n;
    ['edTop', 'tools', 'edScroll', 'edFoot'].forEach((id) => { $(id).hidden = !n; });
    if (!n) {
      const empty = !state.notes.length;
      $('blankTitle').textContent = empty ? 'Your notebook is empty' : 'No note open';
      $('blankText').textContent = empty ? 'Tap New note to write your first one.' : 'Pick a note from the list, or start a new one.';
      return;
    }
    el.title.value = n.title;
    el.title.placeholder = untitled(n);
    quill.setContents(n.content, SILENT);
    if (n.kind === 'list') enforceList(SILENT);
    quill.history.clear();
    fmt = {};
    lastSel = { index: Math.max(0, quill.getLength() - 1), length: 0 };
    renderNoteHeader(n);
    renderFooter(n);
    applyTypewriter(true);
    syncTools();
  }
  function renderNoteHeader(n) {
    $('edAvatar').innerHTML = avatar(n, 32);
    el.editor.style.setProperty('--nc', `var(--${n.color})`);
    el.editor.style.setProperty('--on-nc', `var(--on-${n.color})`);
  }

  /* The list, folder counts and stats can wait for the next frame, so fast typing does not rebuild them on every key. */
  let refreshQueued = false;
  function refreshLists() {
