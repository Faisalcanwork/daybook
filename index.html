    if (empty) { if (empty.dataset.empty === 'new') newNote(); else clearSearch(); return; }
    if (swallowPressTap()) return;
    const row = e.target.closest('[data-id]'); if (row) openNote(row.dataset.id);
  });
  el.list.addEventListener('scroll', closeMenu);

  el.title.addEventListener('input', (e) => { const n = activeNote(); if (n) { n.title = e.target.value; touchMeta(n); } });
  el.title.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); quill.setSelection(quill.getLength() - 1, 0, USER); } });

  /* Shortcuts run before the editor's own keys, so the ones you set are the only ones. */
  root.addEventListener('keydown', (e) => {
    if (e.isComposing || !settings.shortcutsOn || !(e.ctrlKey || e.metaKey)) return;
    const keys = { code: e.code, alt: e.altKey, shift: e.shiftKey };
    const id = SHORTCUT_IDS.find((i) => sameKeys(shortcutFor(i), keys));
    if (id) { e.preventDefault(); e.stopImmediatePropagation(); runCommand(id); }
  }, true);

  el.tools.addEventListener('mousedown', (e) => e.preventDefault());             // keep the cursor in the text
  el.tools.addEventListener('click', (e) => { const b = e.target.closest('[data-cmd]'); if (b) runCommand(b.dataset.cmd); });

  $('folderAdd').addEventListener('click', newFolder);
  /* Up and Down move through the note list, so it works with arrow keys or a controller. */
  el.list.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const rows = [...el.list.querySelectorAll('.row')], i = rows.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault(); rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus();
  });
  el.folders.addEventListener('click', (e) => {
    if (e.target.closest('input') || swallowPressTap()) return;
    const f = e.target.closest('[data-folder]'); if (f) selectFolder(f.dataset.folder);
  });
  el.folders.addEventListener('dblclick', (e) => { const f = e.target.closest('[data-folder]'); if (f && !e.target.closest('input')) startRename(f.dataset.folder); });
  el.folders.addEventListener('keydown', (e) => {
    if (e.target.id === 'folderInput') {
      if (e.key === 'Enter') { e.preventDefault(); finishRename(true); }
      else if (e.key === 'Escape') finishRename(false);
      return;
    }
    const f = e.target.closest('[data-folder]'); if (!f) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectFolder(f.dataset.folder); }
    else if (e.key === 'F2') { e.preventDefault(); startRename(f.dataset.folder); }
  });
  el.folders.addEventListener('focusout', (e) => { if (e.target.id === 'folderInput') finishRename(true); });

  $('edAvatar').addEventListener('click', (e) => { if (!ui.activeId) return; const r = e.currentTarget.getBoundingClientRect(); openMenu('note', ui.activeId, r.left, r.bottom + 6); });
  bindMenu(el.folders, 'folder', (e) => (e.target.closest('input') ? null : e.target.closest('[data-folder]')?.dataset.folder));
  el.menu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const n = findNote(menu.id), run = menuActions[b.dataset.act];
    if (run && (n || menu.kind === 'folder' || menu.kind === 'new')) run(n, b.dataset.v, b);
  });
  document.addEventListener('pointerdown', (e) => { if (!el.menu.hidden && !e.target.closest('#menu')) closeMenu(); }, true);
  window.addEventListener('resize', closeMenu);

  $('settingsBtn').addEventListener('click', openDialog);
  $('kDone').addEventListener('click', closeDialog);
  el.dlg.addEventListener('click', (e) => { if (e.target === el.dlg) closeDialog(); });
  $('dkSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-dk]'); if (!b || b.disabled) return; settings.defaultKind = b.dataset.dk; store.save(); applyDefaultKind(); });
  $('tbSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-tb]'); if (!b) return; settings.toolbar = b.dataset.tb; store.save(); applyToolbar(); });
  $('scSwitch').addEventListener('click', () => { settings.shortcutsOn = !settings.shortcutsOn; store.save(); renderShortcutHints(); });
  $('kReset').addEventListener('click', () => { settings.shortcuts = {}; recording = null; say(''); store.save(); renderDialog(); renderShortcutHints(); });
  /* A shortcut box is a text box: click into it, press the keys you want, done. */
  $('krows').addEventListener('focusin', (e) => { const i = e.target.closest('[data-rec]'); if (!i) return; recording = i.dataset.rec; say(''); paintKeys(); });
  $('krows').addEventListener('focusout', (e) => { if (e.target.closest('[data-rec]') && recording === e.target.dataset.rec) { recording = null; paintKeys(); } });
  document.addEventListener('keyup', (e) => { if (recording) showLive(e); }, true);
  document.addEventListener('keydown', (e) => {                                  // Escape closes the dialog or the menu; recording takes every key
    if (!el.dlg.hidden) { if (recording) recordKey(e); else if (e.key === 'Escape') closeDialog(); return; }
    if (e.key === 'Escape' && !el.menu.hidden) closeMenu();
  }, true);

  /* Save what is pending when the page is hidden, and refresh the date after the page was in the background. */
  window.addEventListener('pagehide', () => store.flush());
  document.addEventListener('visibilitychange', () => { if (document.hidden) store.flush(); else { renderToday(); renderStats(); runSync(); } });

  /* ================= Cloud sync ================= */
  const saveSyncCfg = () => { try { if (sync.cfg) localStorage.setItem(SYNC_KEY, JSON.stringify(sync.cfg)); else localStorage.removeItem(SYNC_KEY); } catch { /* ignore */ } };
  const byId = (a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  const localData = () => ({ notes: state.notes, folders: state.folders, gone: state.gone });
  /* A comparable form that ignores key order, so equal data always matches. */
  const sig = (d) => JSON.stringify([
    [...d.notes].sort(byId).map((n) => [n.id, n.title, n.content, n.color, n.pinned, n.created, n.updated, n.meta, n.folders || [], n.kind || 'notes']),
    [...d.folders].sort(byId).map((f) => [f.id, f.name, f.updated || 0]),
    Object.entries(d.gone).sort()
  ]);
  function cleanRemote(d) {
    const out = { notes: [], folders: [], gone: {} };
    if (!isObj(d)) return out;
    if (Array.isArray(d.folders)) out.folders = d.folders.filter((f) => isObj(f) && safeId(f.id) && str(f.name).trim()).map((f) => ({ id: f.id, name: f.name, updated: isNum(f.updated) ? f.updated : 0 }));
    const ids = new Set([...out.folders.map((f) => f.id), ...state.folders.map((f) => f.id)]);
    if (Array.isArray(d.notes)) out.notes = d.notes.map((n) => cleanNote(n, ids)).filter(Boolean);
    if (isObj(d.gone)) for (const [k, v] of Object.entries(d.gone)) if (safeId(k) && isNum(v)) out.gone[k] = v;
    return out;
  }
  /* Newest edit wins for each note and folder. A deletion wins unless the item was edited after it. */
  function mergeData(a, b) {
    const gone = { ...a.gone };
    for (const [k, v] of Object.entries(b.gone)) gone[k] = Math.max(gone[k] || 0, v);
    const pick = (list) => { const m = new Map(); for (const x of list) { const o = m.get(x.id); if (!o || (x.updated || 0) > (o.updated || 0)) m.set(x.id, x); } return m; };
    /* A note's text comes from whichever copy was written last; its title, colour, pin and folders come from whichever copy had those changed last. */
    const pickNotes = (list) => {
      const text = pick(list), look = new Map();
      for (const x of list) { const o = look.get(x.id); if (!o || (x.meta || 0) > (o.meta || 0)) look.set(x.id, x); }
      for (const [id, t] of text) {
        const l = look.get(id); if (l === t) continue;
        const c = { ...t, title: l.title, color: l.color, pinned: l.pinned, meta: l.meta }; if (l.folders) c.folders = l.folders; else delete c.folders;
        text.set(id, c);
      }
      return text;
    };
    const keep = (m) => { for (const [id, x] of [...m]) { if (gone[id] !== undefined && gone[id] >= Math.max(x.updated || 0, x.meta || 0)) m.delete(id); else delete gone[id]; } return [...m.values()]; };
    const folders = keep(pick([...a.folders, ...b.folders]));
    const ids = new Set(folders.map((f) => f.id));
    const notes = keep(pickNotes([...a.notes, ...b.notes])).map((n) => {
      if (!n.folders?.some((f) => !ids.has(f))) return n;
      const c = { ...n, folders: n.folders.filter((f) => ids.has(f)) };
      if (!c.folders.length) delete c.folders;
      return c;
    }).sort((x, y) => y.created - x.created);
    const cutoff = Date.now() - 90 * 864e5;
    for (const [k, v] of Object.entries(gone)) if (v < cutoff) delete gone[k];
    return { notes, folders, gone };
  }
  const noteFace = (n) => n && JSON.stringify([n.title, n.content]);
  function applyMerged(m) {
    state.notes = m.notes; state.folders = m.folders; state.gone = m.gone;
    store.save(true);
    if (ui.folder !== ALL && !findFolder(ui.folder)) ui.folder = ALL;
    refreshAll();
  }
  async function callSync(body) {
    const r = await fetch(sync.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: sync.cfg.key, ...body }) });
    let j; try { j = await r.json(); } catch { throw new Error('the web app did not answer. Check the URL'); }
    return j;
  }
  function setSync(status, err = '') { const was = sync.status; sync.status = status; sync.err = err; paintSaved(); renderSync(); if (status === 'error' && was !== 'error' && !sync.connecting) toast('Could not sync. Your notes are safe on this device.'); }
  async function runSync() {
    if (!sync.cfg) return;
    if (sync.busy) { sync.again = true; return; }
    if (!navigator.onLine) { setSync('offline'); return; }
    sync.busy = true; setSync('syncing');
    let retry = 0;
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const g = await callSync({ op: 'get' });
        if (!g.ok) throw new Error(g.error === 'auth' ? 'the secret key is wrong' : (g.error || 'the web app refused'));
        const remote = cleanRemote(g.data);
        const before = localData();
        const merged = mergeData(before, remote);
        const open = activeNote();
        const incoming = open && merged.notes.find((n) => n.id === open.id);
        const openChanges = open && (!incoming || noteFace(incoming) !== noteFace(open));
        if (openChanges && (document.activeElement === el.title || quill.hasFocus())) { retry = 4000; break; }   // never replace the note while you are typing in it
        const wasOpen = ui.activeId;
        if (sig(merged) !== sig(before)) {
          applyMerged(merged);
          if (wasOpen && !findNote(wasOpen)) { ui.activeId = null; renderEditor(); renderList(); setView('list'); }
          else if (openChanges) renderEditor();
        }
        if (sig(merged) === sig(remote)) { sync.cfg.last = Date.now(); saveSyncCfg(); setSync('synced'); return; }
        const p = await callSync({ op: 'put', rev: g.rev, data: { v: 1, notes: merged.notes, folders: merged.folders, gone: merged.gone } });
        if (p.ok) { sync.cfg.last = Date.now(); saveSyncCfg(); setSync('synced'); return; }
        if (p.error !== 'conflict') throw new Error(p.error === 'auth' ? 'the secret key is wrong' : (p.error || 'the web app refused'));
      }
      if (!retry) throw new Error('another device kept changing the notes');
    } catch (e) {
      if (!navigator.onLine || e instanceof TypeError) setSync('offline'); else setSync('error', e.message);
      return;
    } finally {
      sync.busy = false;
      if (sync.again) { sync.again = false; retry = retry || 1500; }
      if (retry) scheduleSync(retry);
    }
  }
  function scheduleSync(ms = 2500) { if (!sync.cfg) return; clearTimeout(sync.timer); sync.timer = setTimeout(runSync, ms); }
  store.after = () => scheduleSync();

  /* Sync section of the settings dialog */
  const SYNC_TEXT = { syncing: 'Syncing…', synced: 'Synced', offline: 'Offline', idle: 'Connected', error: 'Problem' };
  function renderSync() {
    const on = !!sync.cfg, word = on ? SYNC_TEXT[sync.status] || 'Connected' : 'Off';
    $('syncForm').hidden = on; $('syncOn').hidden = !on;
    $('syncState').className = 'sync-state' + (on && sync.status === 'synced' ? ' ok' : on && sync.status === 'error' ? ' bad' : '');
    $('syncState').textContent = word;
    $('syncStatusVal').textContent = !on ? '' : sync.status === 'error' ? `Problem: ${sync.err}` : word;
    $('syncLastVal').textContent = !on ? '' : sync.cfg.last ? ago(sync.cfg.last) : 'Not yet';
  }
  async function connectSync() {
    const url = $('syncUrl').value.trim(), key = $('syncSecret').value.trim();
    const bad = (t) => { const st = $('syncState'); st.textContent = t; st.className = 'sync-state bad'; };
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) return bad('Check the URL');
    if (!key) return bad('Enter the key');
    sync.cfg = { url, key, last: 0 }; saveSyncCfg();
    sync.connecting = true;
    try { await runSync(); } finally { sync.connecting = false; }
    if (sync.status === 'error' || sync.status === 'offline') { const msg = sync.status === 'offline' ? 'you are offline' : sync.err; sync.cfg = null; saveSyncCfg(); setSync('idle'); bad(`Failed: ${msg}`); }
    else { $('syncSecret').value = ''; toast('Sync connected'); }
  }
  function disconnectSync() { clearTimeout(sync.timer); sync.cfg = null; saveSyncCfg(); sync.status = 'idle'; paintSaved(); renderSync(); toast('Sync disconnected'); }
  $('syncConnect').addEventListener('click', connectSync);
  $('syncNow').addEventListener('click', async () => { await runSync(); if (sync.status === 'synced') toast('Synced'); else if (sync.status === 'offline') toast('You are offline'); });
  $('syncOff').addEventListener('click', disconnectSync);
  $('saved').addEventListener('click', () => { if (sync.cfg) runSync(); });
  window.addEventListener('online', () => runSync());
  window.addEventListener('offline', () => { if (sync.cfg) setSync('offline'); });
  setInterval(() => { if (sync.cfg && !document.hidden) runSync(); }, 60000);

  /* ================= Start ================= */
  renderToday();
  renderShortcutHints();
  applyTypewriter();
  refreshAll();
  renderEditor();
  renderSync();
  if (sync.cfg) setTimeout(runSync, 400);

  /* Two windows of Daybook (a tab and the installed app, or two tabs) share one saved copy. When the other one saves, its notes are merged into
     this one with the same rule sync uses (newest edit wins, deletions stay deleted), so neither window can wipe out the other's notes. */
  function otherWindowSaved(json) {
    let d; try { d = JSON.parse(json); } catch { return; }
    const before = localData(), merged = mergeData(before, cleanRemote(d));
    if (sig(merged) === sig(before)) return;
    const open = activeNote(), wasOpen = ui.activeId;
    const incoming = open && merged.notes.find((n) => n.id === open.id);
    const typing = open && (document.activeElement === el.title || quill.hasFocus());
    if (typing && incoming) merged.notes = merged.notes.map((n) => (n.id === open.id ? open : n));    // what is being typed here is kept
    const changed = open && (!incoming || noteFace(incoming) !== noteFace(open)) && !typing;
    applyMerged(merged);
    if (wasOpen && !findNote(wasOpen)) { ui.activeId = null; renderEditor(); renderList(); setView('list'); }
    else if (changed) renderEditor();
  }
  if (channel) channel.onmessage = (e) => { if (typeof e.data === 'string') otherWindowSaved(e.data); };
  else window.addEventListener('storage', (e) => { if (e.key === STORE_KEY && e.newValue) otherWindowSaved(e.newValue); });   // only when notes are in localStorage
})();
</script>


<script>
/* Installable and offline: the service worker keeps a copy of the app on the device. Only runs on a real web address, not when the file is opened directly. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
/* Ask the browser not to clear the notes when it is short of space. */
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* not available */ }
</script>
</html>
